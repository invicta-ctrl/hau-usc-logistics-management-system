}

[data-theme="dark"] .theme-toggle__sun {
  opacity: 0;
  transform: rotate(80deg) scale(0.5);
}

[data-theme="dark"] .theme-toggle__moon {
  color: var(--gold-300);
  opacity: 1;
  transform: rotate(0) scale(1);
}

.main {
  background: transparent;
}

.main__inner {
  max-width: var(--content-max);
  padding: clamp(var(--s-8), 5vw, var(--s-16)) clamp(var(--s-4), 4vw, var(--s-12));
}

.stage > * + * {
  margin-top: var(--s-8);
}

.page-head {
  align-items: end;
  border-bottom: 1px solid var(--line);
  gap: var(--s-10);
  padding-bottom: var(--s-8);
}

.page-head__title {
  max-width: 820px;
}

.page-head h1 {
  color: var(--ink);
  font-size: clamp(34px, 3.5vw, 58px);
  font-weight: 760;
  letter-spacing: var(--tracking-tight);
  line-height: 0.98;
}

.page-head p {
  color: var(--ink-2);
  font-size: var(--t-md);
  line-height: 1.65;
  margin-top: var(--s-4);
  max-width: 68ch;
}

.breadcrumbs {
  color: var(--muted);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.attention {
  align-items: stretch;
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) repeat(2, minmax(0, 1fr));
  overflow: visible;
}

.attention__item {
  background: transparent;
  border-color: var(--line);
  border-radius: 0;
  min-height: 164px;
  padding: var(--s-6);
}

.attention__item:first-child {
  background: var(--anchor);
  border-color: var(--anchor);
  color: var(--white);
  min-height: 190px;
}

.attention__item:first-child .attention__label,
.attention__item:first-child .attention__note,
.attention__item:first-child .icon {
  color: color-mix(in srgb, var(--white) 78%, transparent);
}

.attention__item:first-child .attention__value {
  color: var(--white);
}

.attention__item[data-urgent="true"]::after {
  background: var(--gold-500);
  content: "";
  height: var(--gold-rule);
  inset: auto var(--s-6) var(--s-4);
  position: absolute;
}

.attention__value {
  font-size: var(--t-2xl);
  font-weight: 760;
  letter-spacing: var(--tracking-tight);
}

.panel,
.table-wrap,
.detail,
.receipt,
.auth-card,
.form-grid fieldset {
  background: var(--paper);
  border-color: var(--line);
  box-shadow: var(--elev-1);
}

.panel,
.table-wrap,
.detail,
.receipt {
  border-radius: var(--r-sm);
}

.panel__head,
.detail__head {
  border-bottom-color: var(--line);
  padding: var(--s-6);
}

.panel__body,
.detail__body {
  padding: var(--s-6);
}

.q thead {
  background: var(--paper-2);
}

.q th,
.q td {
  padding-block: var(--s-4);
}

.q tbody tr:hover {
  background: var(--anchor-soft);
}

.q tbody tr[aria-selected="true"] {
  background: var(--accent-wash);
  box-shadow: inset var(--gold-rule) 0 0 var(--gold-600);
}

.q__link b {
  color: var(--ink);
}

.btn {
  border-radius: var(--r-xs);
  min-height: var(--control-h);
  padding-inline: var(--s-5);
  white-space: nowrap;
}

.btn--primary {
  background: var(--anchor);
  border-color: var(--anchor);
  box-shadow: 0 8px 20px color-mix(in srgb, var(--anchor) 18%, transparent);
  color: var(--anchor-ink);
}

.btn--primary:hover {
  background: var(--ox-700);
  border-color: var(--ox-700);
  transform: translateY(-1px);
}

.chip {
  border-radius: var(--r-pill);
  font-weight: 750;
  letter-spacing: 0.035em;
}

.timeline::before {
  background: var(--line);
}

.timeline__dot {
  background: var(--paper);
  border-color: var(--line-strong);
}

.timeline li[data-current="true"] .timeline__dot {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 5px var(--accent-wash);
}

.preview-loading {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--elev-1);
  overflow: hidden;
}

.preview-loading__head {
  align-items: center;
  display: flex;
  gap: var(--s-4);
  padding: var(--s-5) var(--s-6);
}

.preview-loading__head > span:last-child {
  display: grid;
  gap: var(--s-1);
}

.preview-loading__head small {
  color: var(--muted);
  font-size: var(--t-xs);
}

.preview-loading__mark {
  align-items: end;
  display: flex;
  gap: var(--s-1);
  height: 22px;
}

.preview-loading__mark i {
  animation: load-bars 900ms var(--ease) infinite alternate;
  background: var(--anchor);
  height: 45%;
  width: 4px;
}

.preview-loading__mark i:nth-child(2) {
  animation-delay: var(--preview-load-delay);
  height: 100%;
}

.preview-loading__mark i:nth-child(3) {
  animation-delay: calc(var(--preview-load-delay) * 2);
  height: 68%;
}

@keyframes load-bars {
  to { transform: scaleY(0.4); }
}

.preview-loading__progress {
  background: var(--line-hair);
  height: var(--gold-rule);
  overflow: hidden;
}

.preview-loading__progress span {
  animation: load-progress 1.6s var(--ease) both;
  background: linear-gradient(90deg, var(--anchor), var(--gold-500));
  display: block;
  height: 100%;
  transform-origin: left;
  width: 100%;
}

@keyframes load-progress {
  from { transform: scaleX(0.12); }
  to { transform: scaleX(0.92); }
}

.preview-loading__row {
  border-bottom: 1px solid var(--line-hair);
  display: grid;
  gap: var(--s-4);
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 92px;
  padding: var(--s-4) var(--s-6);
}

.preview-loading__row:last-child {
  border-bottom: 0;
}

.skeleton--primary,
.skeleton--secondary {
  height: 13px;
}

.skeleton--primary {
  width: 82%;
}

.preview-loading__row:nth-child(even) .skeleton--primary {
  width: 68%;
}

.skeleton--secondary {
  width: 58%;
}

.skeleton--status {
  border-radius: var(--r-pill);
  height: 22px;
}

.public {
  background:
    radial-gradient(circle at 12% 6%, var(--accent-wash), transparent 24%),
    var(--canvas);
}

.public__bar {
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  border-bottom-color: var(--line);
  min-height: 88px;
  padding-inline: clamp(var(--s-4), 5vw, var(--s-16));
}

.public__brand {
  gap: var(--s-4);
}

.public__marks {
  border-color: var(--anchor-line);
  border-radius: var(--r-xs);
  overflow: hidden;
}

.public__mark:first-child {
  background: var(--anchor);
  color: var(--white);
}

.public__wordmark b {
  color: var(--ink);
  font-family: var(--font-wordmark);
  font-size: var(--t-lg);
}

.public__wordmark span {
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.public__main {
  padding: clamp(var(--s-10), 8vw, 112px) clamp(var(--s-4), 6vw, var(--s-16));
}

.public__main--wide {
  max-width: 1420px;
}

.public__head {
  max-width: 900px;
}

.public__head h1 {
  font-size: var(--t-display);
  font-weight: 760;
  letter-spacing: var(--tracking-tight);
  line-height: 0.98;
}

.public__head p {
  color: var(--ink-2);
  font-size: var(--t-lg);
  line-height: 1.55;
  margin-top: var(--s-5);
  max-width: 64ch;
}

.portal-grid {
  align-items: stretch;
  display: grid;
  gap: var(--s-4);
  grid-template-columns: repeat(12, minmax(0, 1fr));
  margin-top: var(--s-12);
}

.portal-card {
  background: var(--paper);
  border-color: var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--elev-1);
  grid-column: span 4;
  min-height: 220px;
  padding: var(--s-8);
}

.portal-card:first-child {
  background: var(--anchor);
  border-color: var(--anchor);
  color: var(--white);
  grid-column: span 8;
}

.portal-card:first-child > span:not(.portal-card__mark) {
  color: color-mix(in srgb, var(--white) 78%, transparent);
}

.portal-card:last-child {
  grid-column: span 8;
}

.portal-card:hover {
  border-color: var(--accent-line);
  box-shadow: var(--elev-2);
  transform: translateY(-3px);
}

.portal-card__mark {
  background: var(--accent-wash);
  border-color: var(--accent-line);
  color: var(--anchor);
}

.portal-card:first-child .portal-card__mark {
  background: color-mix(in srgb, var(--white) 12%, transparent);
  border-color: color-mix(in srgb, var(--white) 24%, transparent);
  color: var(--gold-300);
}

.back-control {
  align-items: center;
  color: var(--ink);
  display: inline-flex;
  gap: var(--s-3);
  min-height: var(--control-h);
  padding: var(--s-1) var(--s-2);
  text-decoration: none;
}

.back-control__glyph {
  align-items: center;
  background: var(--gold-300);
  border-radius: 50%;
  color: var(--accent-ink);
  display: flex;
  height: 36px;
  justify-content: center;
  overflow: hidden;
  width: 36px;
}

.back-control__glyph .icon {
  transition: transform var(--m-small) var(--ease);
}

.back-control:hover .back-control__glyph .icon {
  transform: translateX(-3px);
}

.back-control > span:last-child {
  display: grid;
  line-height: 1.1;
}

.back-control small {
  color: var(--muted);
  font-size: var(--t-2xs);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.back-control b {
  font-size: var(--t-sm);
  white-space: nowrap;
}

.auth-card,
.form-grid {
  max-width: 800px;
}

.auth-card {
  border-top: var(--gold-rule) solid var(--accent);
  padding: clamp(var(--s-6), 5vw, var(--s-12));
}

.auth-card h1 {
  font-size: clamp(34px, 4vw, 52px);
  letter-spacing: var(--tracking-tight);
}

.form-grid fieldset {
  padding: clamp(var(--s-5), 4vw, var(--s-8));
}

.public__foot {
  border-top-color: var(--line);
  padding-inline: clamp(var(--s-4), 5vw, var(--s-16));
}

input,
select,
textarea {
  min-height: var(--control-h);
}

.field input:not([type="checkbox"]):not([type="radio"]),
.field select,
.q__link {
  min-height: var(--control-h);
}

:where(a, button, input, select, textarea):focus-visible {
  outline: var(--focus-ring);
  outline-offset: 3px;
}

@media (max-width: 1023px) {
  .menu-control__label {
    display: none;
  }

  .menu-control {
    justify-content: center;
    padding-inline: var(--s-3);
    width: var(--control-h);
  }

  .attention {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .attention__item:first-child {
    grid-column: 1 / -1;
  }

  .portal-card,
  .portal-card:first-child,
  .portal-card:last-child {
    grid-column: span 6;
  }
}

@media (max-width: 767px) {
  .topbar {
    gap: var(--s-2);
    min-height: 64px;
    padding-inline: var(--s-3);
  }

  .search {
    min-width: 0;
  }

  .account-button__text,
  .search kbd {
    display: none;
  }

  .main__inner {
    padding: var(--s-8) var(--s-4) calc(var(--s-16) + var(--s-8));
  }

  .page-head {
    align-items: start;
    padding-bottom: var(--s-6);
  }

  .page-head h1 {
    font-size: clamp(32px, 11vw, 46px);
  }

  .attention {
    grid-template-columns: 1fr;
  }

  .attention__item:first-child {
    grid-column: auto;
  }

  .attention__item,
  .attention__item:first-child {
    min-height: 142px;
  }

  .public__bar {
    min-height: 72px;
    padding-inline: var(--s-4);
  }

  .public__wordmark span {
    display: none;
  }

  .public__wordmark b {
    font-size: var(--t-md);
  }

  .public__main {
    padding: var(--s-12) var(--s-4) var(--s-16);
  }

  .public__head h1 {
    font-size: clamp(36px, 12vw, 50px);
  }

  .public__head p {
    font-size: var(--t-md);
  }

  .portal-grid {
    margin-top: var(--s-8);
  }

  .portal-card,
  .portal-card:first-child,
  .portal-card:last-child {
    grid-column: 1 / -1;
    min-height: 180px;
  }

  .preview-loading__row {
    grid-template-columns: minmax(0, 1fr) 82px;
  }

  .preview-loading__row .skeleton--secondary {
    display: none;
  }
}

@media (max-width: 414px) {
  .public__marks {
    display: none;
  }

  .back-control > span:last-child,
  .topbar .theme-toggle {
    display: none;
  }

  .public__bar-actions {
    gap: var(--s-1);
  }

  .public__bar-actions .theme-toggle {
    min-width: 64px;
  }

  .portal-card {
    padding: var(--s-6);
  }
}

@media (prefers-reduced-motion: reduce) {
  .route-progress span,
  .preview-loading__mark i,
  .preview-loading__progress span,
  .skeleton {
    animation: none !important;
  }

  .route-progress span {
    transform: none;
  }

  .preview-loading__progress span {
    transform: scaleX(0.92);
  }
}


/* ===== styles/v4.css ===== */
/* Hallmark · genre: modern-minimal · macrostructure: Map / Diagram · design-system: DESIGN.md · designed-as-app · nav: N13/N5 · footer: Ft5 · pre-emit critique: P5 H5 E4 S5 R5 V5 · contrast: pass (40–41) · slop: pass (42–45) · honest: pass (46) · chrome: pass (47) · tokens: pass (48) · responsive: pass (49) · icons: pass (30) · mobile: pass (34, 49, 50–57) */
/*
  DIRECTION CONTRACT
  THESIS: A route console that makes every logistics handoff legible.
  OWN-WORLD: HAU-USC Logistics, its public portals, and role-based workspaces.
  STORY: Enter through the right portal, follow the route, and act without losing custody truth.
  FIRST VIEWPORT: Route, current bank, urgent work, and one clear next action.
  FORM: Oxblood signal rails, gold active segments, warm paper, and charcoal after dark.
  SEED KEY: 00000004 (surface / operate / candidate 5 / degraded, no challengers).
  FINISH: Fast state choreography, linked geometry, precise controls, and a complete reduced-motion path.
  PREVIOUS NAV: N3 authenticated rail / N9 public bar.
  THIS BUILD: N13 authenticated command pill / N5 floating public bar, because 33 role-scoped routes need visible search and compact orientation.
  PRE-EMIT CRITIQUE: P5 H5 E4 S5 R5 V5
*/

@font-face {
  font-family: "Bricolage Grotesque Local";
  font-style: normal;

:root {
  --ox-900: oklch(22% 0.085 22);
  --ox-800: oklch(30% 0.12 22);
  --ox-700: oklch(37% 0.135 22);
  --ox-600: oklch(44% 0.13 22);
  --ox-500: oklch(52% 0.12 22);
  --gold-700: oklch(48% 0.09 82);
  --gold-600: oklch(58% 0.105 82);
  --gold-500: oklch(69% 0.115 82);
  --gold-400: oklch(77% 0.1 82);
  --gold-300: oklch(84% 0.075 82);
  --gold-200: oklch(91% 0.045 82);
  --gold-100: oklch(96% 0.02 82);

  --canvas: oklch(94% 0.012 70);
  --paper: oklch(98.5% 0.008 70);
  --paper-2: oklch(96.5% 0.012 70);
  --paper-3: oklch(99% 0.006 70);
  --cream: oklch(93% 0.027 76);
  --ink: oklch(19% 0.018 22);
  --ink-2: oklch(34% 0.018 22);
  --muted: oklch(44% 0.014 22);
  --line: oklch(85% 0.015 70);
  --line-strong: oklch(72% 0.021 70);
  --line-hair: oklch(91% 0.012 70);
  --white: var(--paper-3);
  --anchor: var(--ox-800);
  --anchor-ink: var(--gold-100);
  --accent: var(--gold-500);
  --accent-ink: var(--ox-900);
  --anchor-soft: color-mix(in oklch, var(--anchor) 8%, var(--paper));
  --anchor-line: color-mix(in oklch, var(--anchor) 25%, var(--line));
  --accent-wash: color-mix(in oklch, var(--accent) 17%, var(--paper));
  --accent-line: color-mix(in oklch, var(--accent) 45%, var(--line));

  --rail-from: var(--ox-800);
  --rail-to: var(--ox-900);
  --rail-ink: var(--gold-100);
  --rail-ink-dim: var(--gold-200);
  --rail-line: color-mix(in oklch, var(--gold-300) 34%, transparent);

  --font-body: "IBM Plex Sans Local", "Aptos", "Segoe UI Variable", system-ui, sans-serif;
  --font-display: "Bricolage Grotesque Local", "Bahnschrift", "Aptos Display", system-ui, sans-serif;
  --font-wordmark: "Newsreader Local", "Palatino Linotype", Georgia, serif;
  --font-mono: var(--font-body);

  --shadow-color: color-mix(in oklch, var(--ox-900) 13%, transparent);
  --shadow-color-strong: color-mix(in oklch, var(--ox-900) 24%, transparent);
  --elev-1: 0 2px 8px var(--shadow-color);
  --elev-2: 0 14px 36px var(--shadow-color);
  --elev-3: 0 24px 64px var(--shadow-color-strong);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease: var(--ease-out);
  --m-instant: 110ms;
  --m-small: 150ms;
  --m-surface: 240ms;
  --m-overlay: 300ms;
  --m-reveal: 420ms;
  --rail-w: 292px;
  --rail-w-collapsed: 84px;
  --route-thick: 10px;
  --route-node: 12px;
  --page-route-thick: 8px;
  --content-max: 1520px;
  --control-h: 46px;
}

[data-theme="dark"] {
  --ox-900: oklch(17% 0.055 22);
  --ox-800: oklch(25% 0.085 22);
  --ox-700: oklch(34% 0.11 22);
  --ox-600: oklch(44% 0.115 22);
  --ox-500: oklch(56% 0.105 22);
  --gold-700: oklch(61% 0.09 82);
  --gold-600: oklch(69% 0.1 82);
  --gold-500: oklch(78% 0.095 82);
  --gold-400: oklch(84% 0.08 82);
  --gold-300: oklch(89% 0.06 82);
  --gold-200: oklch(93% 0.035 82);
  --gold-100: oklch(97% 0.016 82);
  --canvas: oklch(12.5% 0.012 22);
  --paper: oklch(17% 0.014 22);
  --paper-2: oklch(20.5% 0.016 22);
  --paper-3: oklch(24% 0.018 22);
  --cream: oklch(88% 0.03 76);
  --ink: oklch(95% 0.01 70);
  --ink-2: oklch(82% 0.012 38);
  --muted: oklch(70% 0.012 30);
  --line: oklch(30% 0.016 22);
  --line-strong: oklch(42% 0.02 22);
  --line-hair: oklch(25% 0.014 22);
  --anchor: var(--ox-600);
  --anchor-ink: var(--gold-100);
  --accent: var(--gold-500);
  --accent-ink: var(--ox-900);
  --rail-from: oklch(24% 0.08 22);
  --rail-to: oklch(13% 0.035 22);
  --rail-ink: var(--gold-100);
  --rail-ink-dim: var(--gold-200);
  --shadow-color: color-mix(in oklch, var(--ox-900) 44%, transparent);
  --shadow-color-strong: color-mix(in oklch, var(--ox-900) 68%, transparent);
}

html,
body {
  background: var(--canvas);
  overflow-x: clip;
}

body {
  color: var(--ink);
  font-synthesis: none;
}

body::before {
  background:
    linear-gradient(90deg, transparent 0 76%, var(--accent-wash) 76% 76.3%, transparent 76.3%),
    linear-gradient(180deg, transparent 0 34%, var(--anchor-soft) 34% 34.25%, transparent 34.25%),
    var(--canvas);
  opacity: 0.58;
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}

:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 3px;
}

.preview-bar {
  background: var(--paper);
  border-color: var(--line);
  box-shadow: 0 2px 10px var(--shadow-color);
}

.preview-bar__brand > .icon,
.preview-bar__tag {
  color: var(--anchor);
}

.preview-select,
.preview-group,
.preview-bar .btn {
  border-radius: var(--r-pill);
}

.frame {
  background: transparent;
}

.shell {
  background: transparent;
  min-height: calc(100dvh - var(--preview-bar-h, 0px));
}

.workspace {
  grid-template-rows: auto auto minmax(0, 1fr);
}

/* Route console rail */
.rail {
  background: linear-gradient(162deg, var(--rail-from), var(--rail-to));
  box-shadow: var(--elev-2);
  color: var(--rail-ink);
  overflow: hidden;
}

.rail::before {
  border-block-start: var(--route-thick) solid var(--gold-400);
  border-start-end-radius: 54px;
  border-inline-end: var(--route-thick) solid var(--gold-400);
  content: "";
  inset: 18px 0 auto 36px;
  height: 76px;
  pointer-events: none;
  position: absolute;
}

.rail::after {
  background: var(--gold-400);
  box-shadow: 0 0 0 5px color-mix(in oklch, var(--gold-400) 18%, transparent);
  height: var(--route-node);
  inset: 88px 4px auto auto;
  width: var(--route-node);
}

.rail__brand {
  min-height: 144px;
  padding: 34px 34px 22px;
  position: relative;
  z-index: var(--z-base);
}

.rail__marks {
  gap: 6px;
}

.rail__mark {
  align-items: center;
  background: transparent;
  border: 1px solid var(--gold-300);
  border-radius: 4px 12px 4px 12px;
  color: var(--gold-200);
  display: inline-flex;
  font-family: var(--font-display);
  font-size: var(--t-xs);
  font-weight: 800;
  justify-content: center;
  letter-spacing: 0.08em;
  min-height: 30px;
  min-width: 46px;
}

.rail__mark:first-child {
  background: var(--gold-400);
  color: var(--accent-ink);
}

.rail__name {
  color: var(--rail-ink);
  display: grid;
  font-family: var(--font-wordmark);
  font-size: var(--t-lg);
  gap: 2px;
  line-height: 1.1;
  margin-top: 18px;
}

.rail__department {
  color: var(--rail-ink-dim);
  font-family: var(--font-body);
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: 0;
}

.rail__system-code {
  color: var(--gold-300);
  display: block;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  letter-spacing: 0.1em;
  margin-top: 10px;
}

.rail__signal {
  align-items: center;
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(3, 7px);
  gap: 7px;
  padding: 0 34px 18px;
}

.rail__signal span {
  background: var(--rail-line);
  height: 1px;
}

.rail__signal i {
  background: var(--gold-400);
  border-radius: 50%;
  height: 7px;
  opacity: 0.32;
  width: 7px;
}

.rail__signal i:first-of-type {
  opacity: 1;
}

.rail__scroll {
  padding-inline: 16px;
}

.rail__section {
  gap: 3px;
}

.rail__section > .label {
  align-items: baseline;
  color: var(--rail-ink-dim);
  display: flex;
  justify-content: space-between;
  padding: 10px 12px 8px;
}

.rail__section > .label b,
.rail__section > .label i {
  font-family: var(--font-body);
  font-size: var(--t-2xs);
  font-style: normal;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.rail__section > .label i {
  color: var(--gold-300);
  font-family: var(--font-mono);
}

.nav-item {
  border-radius: 5px 18px 5px 18px;
  color: var(--rail-ink-dim);
  display: grid;
  gap: 10px;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  min-height: 48px;
  padding: 6px 10px;
  text-align: start;
}

.nav-item::before {
  background: var(--gold-400);
  border-radius: var(--r-pill);
  inset: 9px auto 9px 0;
  transform: scaleY(0);
  width: 3px;
}

.nav-item[aria-current="page"]::before {
  transform: scaleY(1);
}

.nav-item[aria-current="page"] {
  background: var(--gold-400);
  box-shadow: none;
  color: var(--accent-ink);
}

.nav-item[aria-current="page"] .icon,
.nav-item[aria-current="page"] .nav-item__code {
  color: var(--accent-ink);
}

.nav-item__code {
  color: var(--gold-300);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
}

.rail__foot {
  background: color-mix(in oklch, var(--rail-to) 80%, transparent);
  border-top: 1px solid var(--rail-line);
  padding: 12px 16px 16px;
}

.scope-button {
  border-radius: 5px 18px 5px 18px;
  color: var(--rail-ink-dim);
}

.scope-button .avatar {
  background: var(--gold-400);
  color: var(--accent-ink);
}

.scope-button b {
  color: var(--rail-ink);
}

.shell[data-rail="collapsed"] .rail__system-code,
.shell[data-rail="collapsed"] .nav-item__code,
.shell[data-rail="collapsed"] .rail__signal,
.shell[data-rail="collapsed"] .rail__section > .label i {
  display: none;
}

/* N13 command bar */
.topbar {
  background: color-mix(in oklch, var(--paper) 94%, transparent);
  border-bottom: 1px solid var(--line-hair);
  box-shadow: 0 8px 24px var(--shadow-color);
  gap: 12px;
  grid-template-columns: auto minmax(130px, 220px) minmax(220px, 1fr) auto;
  min-height: 82px;
  padding-inline: clamp(16px, 3vw, 44px);
}

.menu-control {
  background: var(--anchor);
  border-color: var(--anchor);
  border-radius: 5px 16px 5px 16px;
  color: var(--anchor-ink);
  min-height: 46px;
}

.menu-control__glyph i {
  transition: opacity var(--m-instant) var(--ease-out), transform var(--m-small) var(--ease-out);
}

.topbar__route {
  display: grid;
  flex: 0 1 220px;
  gap: 2px;
  min-width: 0;
}

.topbar__route span {
  color: var(--anchor);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.1em;
}

.topbar__route b {
  color: var(--ink);
  font-size: var(--t-sm);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.searchpill {
  align-items: center;
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  color: var(--muted);
  display: flex;
  flex: 1 1 380px;
  gap: 10px;
  justify-content: flex-start;
  max-width: 620px;
  min-height: 46px;
  min-width: 180px;
  padding: 0 8px 0 16px;
  text-align: start;
}

.searchpill > span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.searchpill kbd,
.cmdk kbd {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 1px 0 var(--line-strong);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  padding: 4px 7px;
  white-space: nowrap;
}

.topbar__actions {
  gap: 6px;
}

.account-button {
  border-radius: 5px 16px 5px 16px;
}

.route-progress {
  align-items: center;
  background: var(--paper);
  display: grid;
  gap: 8px;
  grid-template-columns: minmax(0, 1fr) auto repeat(3, 7px);
  height: 18px;
  overflow: hidden;
  padding-inline: clamp(16px, 3vw, 44px);
}

.route-progress > .route-progress__line {
  animation: none;
  background: var(--anchor-line);
  display: block;
  height: 2px;
  transform-origin: left;
}

.route-progress > .route-progress__code {
  animation: none;
  background: transparent;
  color: var(--anchor);
  display: inline;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-variant-numeric: tabular-nums;
  height: auto;
}

.route-progress i {
  background: var(--gold-500);
  border-radius: 50%;
  height: 7px;
  transform-origin: center;
  width: 7px;
}

.route-progress[data-run="true"] > .route-progress__line {
  animation: v4-route-draw var(--m-reveal) var(--ease-out) both;
}

.route-progress[data-run="true"] i {
  animation: v4-node-arrive 260ms var(--ease-out) both;
}

.route-progress[data-run="true"] i:nth-of-type(2) { animation-delay: 45ms; }
.route-progress[data-run="true"] i:nth-of-type(3) { animation-delay: 90ms; }

/* Workspace map */
.main {
  background: transparent;
  position: relative;
}

.main::before {
  background:
    linear-gradient(90deg, var(--anchor-line), var(--anchor-line)) 38px 0 / 1px 100% no-repeat,
    linear-gradient(180deg, var(--accent-line), var(--accent-line)) 0 114px / 100% 1px no-repeat;
  content: "";
  inset: 0;
  opacity: 0.38;
  pointer-events: none;
  position: absolute;
}

.main__inner {
  max-width: var(--content-max);
  padding: clamp(32px, 5vw, 80px) clamp(16px, 4vw, 64px) 88px;
  position: relative;
}

.stage {
  view-transition-name: stage;
}

.stage > * {
  animation: none;
}

.preview-action-note {
  color: var(--muted);
  font-size: var(--t-xs);
  font-weight: 650;
  margin-top: 12px;
}

.stage > * + * {
  margin-top: clamp(24px, 3vw, 44px);
}

.page-head {
  align-items: end;
  border-bottom: 0;
  display: grid;
  gap: 28px;
  grid-template-columns: minmax(0, 1fr) auto;
  padding: 0 0 30px;
  position: relative;
}

.page-head::after {
  background:
    linear-gradient(var(--accent), var(--accent)) right bottom / 100% var(--page-route-thick) no-repeat,
    linear-gradient(var(--accent), var(--accent)) right bottom / var(--page-route-thick) 100% no-repeat;
  border-end-end-radius: 34px;
  content: "";
  height: 44px;
  inset: auto 0 0 auto;
  opacity: 0.84;
  pointer-events: none;
  position: absolute;
  width: min(36%, 320px);
}

.page-head__title {
  max-width: 880px;
  min-width: 0;
  padding-inline-end: 20px;
}

.breadcrumbs {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: var(--t-xs);
  letter-spacing: 0.04em;
}

.page-head h1 {
  font-size: clamp(34px, 4vw, 62px);
  font-weight: 780;
  letter-spacing: -0.035em;
  line-height: 1.02;
  max-width: 19ch;
}

.page-head p {
  color: var(--ink-2);
  line-height: 1.65;
  max-width: 68ch;
}

.page-head__actions {
  padding-bottom: 12px;
  position: relative;
  z-index: var(--z-raised);
}

.attention {
  background: transparent;
  border: 0;
  display: grid;
  gap: 10px;
  grid-template-columns: 1.3fr 0.9fr 0.9fr 1fr;
  overflow: visible;
  position: relative;
}

.attention::before {
  background: var(--anchor-line);
  content: "";
  height: 2px;
  inset: 50% 0 auto;
  pointer-events: none;
  position: absolute;
}

.attention__item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 5px 22px 5px 22px;
  box-shadow: none;
  min-height: 132px;
  padding: 20px;
  position: relative;
  z-index: var(--z-base);
}

.attention__item::after {
  background: var(--anchor);
  border: 3px solid var(--paper);
  border-radius: 50%;
  content: "";
  height: var(--route-node);
  inset: 50% -7px auto auto;
  position: absolute;
  transform: translateY(-50%);
  width: var(--route-node);
}

.attention__item[data-urgent="true"] {
  background: var(--anchor-soft);
  border-color: var(--anchor-line);
}

.attention__item:first-child {
  background: var(--paper);
  border-color: var(--line);
  color: var(--ink);
  min-height: 132px;
}

.attention__item:first-child .attention__label,
.attention__item:first-child .attention__note,
.attention__item:first-child .icon {
  color: var(--muted);
}

.attention__item:first-child .attention__value {
  color: var(--anchor);
}

.attention__item[data-urgent="true"]::after {
  background: var(--accent);
}

.attention__value {
  color: var(--anchor);
  font-size: clamp(30px, 3vw, 46px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.035em;
}

.context-line {
  border-block: 1px solid var(--line);
  padding-block: 12px;
}

.card,
.panel,
.rail-block,
.table-wrap,
.split__detail,
.receipt,
.state,
.notice,
.auth-card,
.form-grid fieldset {
  border-radius: 5px 18px 5px 18px;
  box-shadow: none;
}

.card,
.panel,
.rail-block,
.split__detail,
.receipt,
.auth-card,
.form-grid fieldset {
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink);
}

.table-wrap {
  background: var(--paper);
  border: 1px solid var(--line);
  overflow: clip;
}

.q thead {
  background: var(--anchor-soft);
}

.q th,
.q td {
  border-color: var(--line-hair);
}

.q tbody tr {
  position: relative;
}

.q tbody tr[aria-selected="true"] {
  background: var(--anchor-soft);
  box-shadow: none;
}

.q__link {
  min-height: 48px;
  padding-inline-start: 20px;
  position: relative;
}

.q__link::before {
  background: var(--line-strong);
  border-radius: 50%;
  content: "";
  height: 8px;
  inset: 50% auto auto 2px;
  position: absolute;
  transform: translateY(-50%);
  width: 8px;
}

.q tr[aria-selected="true"] .q__link::before,
.q__link:focus-visible::before {
  background: var(--accent);
}

.btn {
  border-radius: 5px 16px 5px 16px;
  min-height: var(--control-h);
  transition: background-color var(--m-small) var(--ease-out), color var(--m-small) var(--ease-out), transform var(--m-instant) var(--ease-out);
  white-space: nowrap;
}

.btn--primary {
  background: var(--anchor);
  border-color: var(--anchor);
  color: var(--anchor-ink);
}

.chip {
  border-radius: var(--r-pill);
}

.field input,
.field select,
.field textarea {
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  border-radius: 5px 14px 5px 14px;
  color: var(--ink);
  min-height: 46px;
  outline: 2px solid transparent;
  outline-offset: 1px;
}

.field input:focus-visible,
.field select:focus-visible,
.field textarea:focus-visible {
  background: var(--paper);
  outline-color: var(--gold-500);
}

.field__message {
  align-items: flex-start;
  display: flex;
  min-height: 1lh;
}

.field :is(input, select, textarea):disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.state {
  background: var(--paper);
  border: 1px solid var(--line);
}

.state__mark {
  background: var(--anchor-soft);
  color: var(--anchor);
}

.meter > span,
.composition > span {
  transform-origin: left;
  transition: transform var(--m-surface) var(--ease-out), opacity var(--m-small) var(--ease-out);
}

/* Public N5 bar and Map / Diagram landing */
.public {
  background: transparent;
  color: var(--ink);
  min-height: calc(100dvh - var(--preview-bar-h, 0px));
}

.public__bar {
  background: color-mix(in oklch, var(--paper) 95%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  box-shadow: var(--elev-1);
  margin: 14px auto 0;
  max-width: min(1180px, calc(100% - 28px));
  min-height: 68px;
  padding: 8px 10px 8px 18px;
  position: sticky;
  top: calc(var(--preview-bar-h, 0px) + 14px);
  z-index: var(--z-sticky);
}

.public__brand {
  min-width: 0;
}

.public__marks {
  display: flex;
  gap: 4px;
}

.public__mark {
  align-items: center;
  background: transparent;
  border: 1px solid var(--anchor-line);
  border-radius: 4px 11px 4px 11px;
  color: var(--anchor);
  display: inline-flex;
  font-family: var(--font-display);
  font-size: var(--t-2xs);
  font-weight: 800;
  justify-content: center;
  min-height: 30px;
  min-width: 42px;
}

.public__mark:first-child {
  background: var(--anchor);
  color: var(--anchor-ink);
}

.public__wordmark b {
  color: var(--ink);
  font-family: var(--font-wordmark);
}

.public__wordmark span {
  color: var(--muted);
}

.public__main {
  max-width: 1120px;
  padding: clamp(54px, 8vw, 112px) clamp(18px, 4vw, 48px) 96px;
  position: relative;
  view-transition-name: stage;
}

.public__main--wide {
  max-width: 1280px;
}

.preview-data-label {
  align-items: center;
  background: var(--accent-wash);
  border: 1px solid var(--accent-line);
  border-radius: var(--r-pill);
  color: var(--ink-2);
  display: inline-flex;
  font-size: var(--t-xs);
  font-weight: 650;
  gap: 8px;
  margin: 0 0 26px;
  min-height: 30px;
  padding: 4px 12px;
}

.public__main::before {
  border-block-start: var(--route-thick) solid var(--anchor);
  border-start-start-radius: 54px;
  border-inline-start: var(--route-thick) solid var(--anchor);
  content: "";
  height: 116px;
  inset: 36px auto auto 0;
  opacity: 0.92;
  pointer-events: none;
  position: absolute;
  width: 38%;
}

.public__head {
  max-width: 880px;
  padding-inline-start: clamp(18px, 4vw, 52px);
  position: relative;
}

.public__head h1 {
  font-size: clamp(42px, 6.6vw, 78px);
  font-weight: 780;
  letter-spacing: -0.04em;
  line-height: 1;
  max-width: 18ch;
}

.public__head p {
  color: var(--ink-2);
  font-size: clamp(16px, 1.8vw, 20px);
  line-height: 1.6;
  max-width: 62ch;
}

.portal-route {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  list-style: none;
  margin: 48px 0 30px;
  padding: 0;
  position: relative;
}

.portal-route::before {
  background: var(--anchor-line);
  content: "";
  height: 2px;
  inset: 22px 12% auto;
  position: absolute;
}

.portal-route li {
  align-items: center;
  color: var(--ink-2);
  display: flex;
  gap: 10px;
  min-height: 44px;
  position: relative;
  z-index: var(--z-base);
}

.portal-route li span {
  align-items: center;
  background: var(--anchor);
  border: 4px solid var(--paper);
  border-radius: 50%;
  color: var(--anchor-ink);
  display: inline-flex;
  flex: 0 0 44px;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-variant-numeric: tabular-nums;
  height: 44px;
  justify-content: center;
}

.portal-route li:nth-child(2) span {
  background: var(--gold-500);
  color: var(--accent-ink);
}

.portal-route li b {
  background: var(--canvas);
  padding-inline-end: 8px;
}

.portal-grid {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  position: relative;
}

.portal-grid::before {
  background: var(--anchor-line);
  content: "";
  inset: 0 50% 0 auto;
  position: absolute;
  width: 2px;
}

.portal-card,
.portal-grid > :first-child {
  align-items: end;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 5px 24px 5px 24px;
  box-shadow: none;
  color: var(--ink);
  display: grid;
  gap: 12px;
  grid-template-columns: auto minmax(0, 1fr);
  min-height: 180px;
  padding: 24px;
  position: relative;
  text-decoration: none;
  z-index: var(--z-base);
}

.portal-grid > :first-child {
  grid-column: span 12;
  grid-template-columns: 72px minmax(0, 1fr);
  min-height: 156px;
}

.portal-grid > :nth-child(2) { grid-column: span 5; }
.portal-grid > :nth-child(3) { grid-column: span 4; }
.portal-grid > :nth-child(4) { grid-column: span 3; }

.portal-card::after {
  background: var(--anchor);
  border: 4px solid var(--paper);
  border-radius: 50%;
  content: "";
  height: 16px;
  inset: 50% -9px auto auto;
  position: absolute;
  transform: translateY(-50%);
  width: 16px;
}

.portal-card__mark {
  align-items: center;
  align-self: start;
  background: var(--anchor-soft);
  border-radius: 5px 18px 5px 18px;
  color: var(--anchor);
  display: inline-flex;
  height: 56px;
  justify-content: center;
  width: 56px;
}

.portal-card b {
  align-self: end;
  font-family: var(--font-display);
  font-size: clamp(18px, 2vw, 27px);
  letter-spacing: -0.025em;
  line-height: 1.08;
}

.portal-card > span:last-child {
  color: var(--muted);
  grid-column: 2;
  line-height: 1.5;
}

.portal-grid > .portal-card:first-child {
  background: var(--paper);
  border-color: var(--line);
  color: var(--ink);
}

.portal-grid > .portal-card:first-child > span:not(.portal-card__mark) {
  color: var(--muted);
}

.portal-grid > .portal-card:first-child .portal-card__mark {
  background: var(--anchor-soft);
  border-color: var(--anchor-line);
  color: var(--anchor);
}

.public__foot {
  display: grid;
  gap: 34px;
  margin: 0 auto;
  max-width: 1120px;
  padding: 12px clamp(18px, 4vw, 48px) 54px;
}

.public__foot-line {

function focusMain() {
  const main = document.getElementById('surface-main');
  if (!main) return;
  main.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function describeFocus(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${CSS.escape(el.id)}`;
  const act = el.dataset?.act;
  if (!act) return null;
  const ref = el.dataset.ref ? `[data-ref="${CSS.escape(el.dataset.ref)}"]` : '';
  const id = el.dataset.id ? `[data-id="${CSS.escape(el.dataset.id)}"]` : '';
  return `[data-act="${CSS.escape(act)}"]${ref}${id}`;
}

function openOverlay(name) {
  lastFocusedSelector = describeFocus(document.activeElement);
  updateView(
    'overlay',
    () => {
      state.overlay = name;
      if (name === 'command') {
        state.commandQuery = '';
        state.commandIndex = 0;
      }
    },
    () => {
      const node = document.querySelector('[data-overlay-root]');
      const preferred = {
        command: '#command-input',
        menu: '[role="menuitem"]',
        notifications: '[data-act="close-overlay"]',
        confirm: '[data-act="confirm-done"]',
        detail: '[data-act="confirm-accept"]',
      }[name];
      if (node) trapFocus(node, preferred ?? null);
    },
  );
}

function closeOverlay() {
  const selector = lastFocusedSelector;
  lastFocusedSelector = null;
  updateView(
    'overlay',
    () => {
      state.overlay = null;
    },
    () => {
      const target = selector ? document.querySelector(selector) : null;
      // Fall back to the main region so focus is never dropped on the body.
      (target ?? document.getElementById('surface-main'))?.focus();
    },
  );
}

/* ---------------- Theme ----------------
   Sun in light, moon in dark. Both glyphs are always in the DOM; CSS rotates
   and crossfades between them so the press transforms the icon rather than
   swapping it. The accessible name describes the ACTION; aria-pressed reports
   whether dark is active, so the state stays truthful. */

/* Colour-only transition, applied for one frame budget so the theme change
   reads as deliberate rather than as a flash. Layout never animates. */
let themeAnimTimer;
function setTheme(next) {
  document.body.classList.add('theme-anim');
  updateView('theme', () => {
    state.theme = next;
    store.set(THEME_KEY, next);
  });
  clearTimeout(themeAnimTimer);
  themeAnimTimer = setTimeout(() => document.body.classList.remove('theme-anim'), 400);
}

/* ---------------- Toast ---------------- */

let toastTimer;
function toast(message) {
  const region = document.getElementById('toast-region');
  if (!region) return;
  region.innerHTML = `<div class="toast">${icon('check')}<span>${esc(message)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    region.innerHTML = '';
  }, 3600);
}

/* ---------------- Internal shell ---------------- */

function routeCode(id) {
  const item = byId(id);
  const prefix = item?.group === 'Administration' ? 'A' : item?.group === 'Public' ? 'P' : 'O';
  const groupItems = SURFACES.filter((surface) => surface.group === item?.group);
  const index = Math.max(0, groupItems.findIndex((surface) => surface.id === id));
  return `${prefix}-${String(index + 1).padStart(2, '0')}`;
}

    ).join('')}
  </nav>`;

function commandMatches(query = '') {
  const needle = query.trim().toLowerCase();
  return SURFACES.filter((surface) => {
    if (!needle) return true;
    return `${surface.name} ${surface.group} ${surface.id}`.toLowerCase().includes(needle);
  }).slice(0, 10);
}

function commandResults(query = state.commandQuery, active = state.commandIndex) {
  const matches = commandMatches(query);
  if (!matches.length) {
    return `<div class="cmdk__empty" role="status">No routes match “${esc(query)}”. Try a request, loan, inventory, or administration term.</div>`;
  }
  return matches
    .map(
      (match, index) => `<button class="cmdk__item${index === active ? ' is-active' : ''}"
        id="command-option-${index}" type="button" role="option" aria-selected="${index === active}"
        data-act="go" data-id="${match.id}">
        <span class="cmdk__code">${routeCode(match.id)}</span>
        <span><b>${esc(match.name)}</b><small>${esc(match.group)}</small></span>
        ${icon('arrow-right', 'icon--sm')}
      </button>`,
    )
    .join('');
}

function syncCommandResults() {
  const list = document.getElementById('command-results');
  const input = document.getElementById('command-input');
  if (!list || !input) return;
  const matches = commandMatches(state.commandQuery);
  if (matches.length) state.commandIndex = Math.min(state.commandIndex, matches.length - 1);
  else state.commandIndex = 0;
  list.innerHTML = commandResults();
  input.setAttribute(
    'aria-activedescendant',
    matches.length ? `command-option-${state.commandIndex}` : '',
  );
  const status = document.getElementById('command-status');
  if (status) status.textContent = `${matches.length} route${matches.length === 1 ? '' : 's'} available`;
}

function moveCommand(delta) {
  const matches = commandMatches(state.commandQuery);
  if (!matches.length) return;
  state.commandIndex = (state.commandIndex + delta + matches.length) % matches.length;
  syncCommandResults();
  document.getElementById(`command-option-${state.commandIndex}`)?.scrollIntoView({ block: 'nearest' });
}

}

/* ---------------- Render ---------------- */

function render() {
  const surface = byId(state.surface);
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-theme', state.theme);

  let body;
  if (state.surface === 'index') {
    body = `<div class="frame" data-viewport="${state.viewport}">${indexPage()}</div>`;
  } else if (surface.kind === 'public') {
    setPublicTheme(state.theme === 'dark');
    body = `<div class="frame" data-viewport="${state.viewport}">${surface.render({
      state: state.variant,
    })}</div>`;
  } else {
    const routeSequence = renderReason === 'boot' || renderReason === 'route';
    body = `<div class="frame" data-viewport="${state.viewport}">
      <div class="shell" data-rail="${state.rail}" data-drawer="${state.drawer}">
        ${rail()}
        <section class="workspace"${state.overlay ? ' inert aria-hidden="true"' : ''}>
          ${topbar()}
          <div class="route-progress" data-run="${routeSequence}" aria-hidden="true">
            <span class="route-progress__line"></span>
            <span class="route-progress__code">${routeCode(state.surface)}</span>
            <i></i><i></i><i></i>
          </div>
          <main class="main" id="surface-main" tabindex="-1">
            <div class="main__inner stage" key="${esc(state.surface)}-${esc(state.variant)}">
              ${surface.render({ state: state.variant })}
            </div>
          </main>
        </section>
        ${tabbar()}
        ${overlays()}
      </div>
    </div>`;
  }

  root.innerHTML = `${previewBar()}${body}
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>`;

  syncPreviewBarHeight();
}

/* The preview bar is preview chrome, not product chrome, but it still occupies
   space above the shell. Publish its height so the sticky rail and topbar sit
   under it instead of overflowing the viewport. */
let barObserver;
function syncPreviewBarHeight() {
  const bar = root.querySelector('.preview-bar');
  if (!bar) return;
  const apply = () =>
    document.documentElement.style.setProperty('--preview-bar-h', `${bar.offsetHeight}px`);
  apply();
  barObserver?.disconnect();
  barObserver = new ResizeObserver(apply);
  barObserver.observe(bar);
}

/* ---------------- Events ---------------- */

function go(id) {
  if (!byId(id) && id !== 'index') return;
  updateView(
    'route',
    () => {
      state.surface = id;
      const s = byId(id);
      state.variant = s?.states?.[0] ?? 'populated';
      state.overlay = null;
      state.drawer = 'closed';
      location.hash = `#/${id}`;
    },
    focusMain,
  );
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (!el) {
    if (state.overlay === 'menu' || state.overlay === 'notifications') closeOverlay();
    return;
  }
  const act = el.dataset.act;

  if (act === 'go') return go(el.dataset.id);
  if (act.startsWith('go:')) return go(act.slice(3));
  if (act === 'viewport') {
    return updateView('viewport', () => {
      state.viewport = el.dataset.v;
    });
  }
  if (act === 'theme') return setTheme(el.dataset.v);
  if (act === 'toggle-theme') return setTheme(state.theme === 'dark' ? 'light' : 'dark');
  if (act === 'toggle-rail') {
    return updateView('local', () => {
      const narrow = state.viewport !== 'desktop' || window.innerWidth <= 1023;
      if (narrow) state.drawer = state.drawer === 'open' ? 'closed' : 'open';
      else state.rail = state.rail === 'expanded' ? 'collapsed' : 'expanded';
    });
  }
  if (act === 'close-drawer') {
    return updateView('local', () => {
      state.drawer = 'closed';
    });
  }
  if (act === 'open-menu') return openOverlay('menu');
  if (act === 'open-notifications') return openOverlay('notifications');
  if (act === 'open-command') return openOverlay('command');
  if (act === 'close-overlay') return closeOverlay();
  if (act === 'confirm-accept') return openOverlay('confirm');
  if (act === 'confirm-return') {
    toast('Preview only: the return was not persisted and stock was not changed.');
    return;
  }
  if (act === 'confirm-release') {
    return updateView(
      'state',
      () => {
        state.variant = 'success';
      },
      () => toast('Partial release recorded and confirmed by the recipient.'),
    );
  }
  if (act === 'confirm-done') {
    closeOverlay();
    toast('Preview only: acceptance was not persisted; no reservation or release changed.');
    return;
  }
  if (act === 'select:request' || act === 'select:release') {
    const narrow = root.querySelector('.frame').clientWidth < 1181;
    if (narrow) return openOverlay('detail');
    toast('Detail shown beside the queue.');
    return;
  }
  if (act === 'cycle-workspace') {
    const i = WORKSPACES.findIndex((w) => w.id === state.workspace);
    return updateView(
      'state',
      () => {
        state.workspace = WORKSPACES[(i + 1) % WORKSPACES.length].id;
      },
      () => toast(`Workspace: ${WORKSPACES.find((w) => w.id === state.workspace).name}`),
    );
  }
  if (act === 'cycle-scope') {
    const i = SCOPES.findIndex((s) => s.id === state.scope);
    return updateView(
      'state',
      () => {
        state.scope = SCOPES[(i + 1) % SCOPES.length].id;
      },
      () => toast(`Scope: ${SCOPES.find((s) => s.id === state.scope).name}`),
    );
  }
  if (act === 'cycle-role') {
    const i = ROLE_VIEWS.findIndex((r) => r.id === state.role);
    lastFocusedSelector = null;
    return updateView(

  RETURNED: 'Returned',
  OVERDUE: 'Overdue',
  ACTIVE: 'Active',
  CLEARED: 'Cleared',
  ARCHIVED: 'Archived',
};

/* Five tones only. See DESIGN.md. */
const STATUS_TONE = {
  ARCHIVED: 'neutral',
  CLEARED: 'neutral',
  RETURNED: 'neutral',
  RESTOCKED: 'neutral',

  FOR_REVIEW: 'info',
  FOR_CANVASSING: 'info',
  WAITING_FOR_BUDGET: 'info',
  TO_BE_PROCURED: 'info',

  ACCEPTED: 'progress',
  PROCURED: 'progress',
  PARTIALLY_RECEIVED: 'progress',
  PARTIALLY_RELEASED: 'progress',
  PARTIALLY_FULFILLED: 'progress',
  READY_TO_RELEASE: 'progress',
  READY_TO_CLAIM: 'progress',
  ON_LOAN: 'progress',
  ACTIVE: 'progress',

  COMPLETED: 'done',

  OVERDUE: 'alert',
  REJECTED: 'alert',
  CANCELLED: 'alert',
};

const ROLE_LABELS = {
  SYSTEM_OWNER: 'System Owner',
  ADMINISTRATOR: 'Administrator',
  DIRECTOR: 'Director',
  COMMITTEE_HEAD: 'Committee Head',
  DOL_STAFF: 'DOL Staff',
  REQUESTER: 'Requester',
  READ_ONLY_AUDITOR: 'Read-only Auditor',
};

const COMMITTEE_LABELS = {
  COM_FOOD: 'Food Committee',
  COM_INVENTORY_PANTRY: 'Inventory and Pantry Committee',
  COM_MATERIALS: 'Materials Committee',
};

const CATEGORY_LABELS = {
  OFFICE_SUPPLIES: 'Office Supplies',
  PANTRY_FOOD: 'Pantry Food',
  EQUIPMENT: 'Equipment',
  PRINTING_SIGNAGE: 'Printing and Signage',
  EVENT_MATERIALS: 'Event Materials',
  CLEANING_SUPPLIES: 'Cleaning Supplies',
  OTHER_CONTROLLED: 'Other Controlled Materials',
};

const LEDGER_LABELS = {
  OPENING_BALANCE: 'Opening Balance',
  RECEIPT: 'Receipt',
  ISSUE: 'Issue',
  LOAN_OUT: 'Loan Out',
  LOAN_RETURN: 'Loan Return',
  ADJUSTMENT_IN: 'Adjustment In',
  ADJUSTMENT_OUT: 'Adjustment Out',
  TRANSFER_OUT_EVENT: 'Transfer Out (Event)',
  TRANSFER_IN_INVENTORY: 'Transfer In (Inventory)',
  EMERGENCY_ISSUE: 'Emergency Issue',
};

const titleCase = (value) =>
  String(value)
    .replaceAll('_', ' ')
    .trim()
    .toLowerCase()
    .replace(/(^|\s|[-/])\p{L}/gu, (c) => c.toUpperCase());

function label(value, map = STATUS_LABELS, missing = 'Not recorded') {
  if (value === null || value === undefined || String(value).trim() === '') return missing;
  return map[value] ?? titleCase(value);
}

const statusLabel = (v) => label(v, STATUS_LABELS);
const tone = (v) => STATUS_TONE[v] ?? 'neutral';

module.exports = { STATUS_LABELS, STATUS_TONE, ROLE_LABELS, COMMITTEE_LABELS, CATEGORY_LABELS, LEDGER_LABELS, label, statusLabel, tone };
