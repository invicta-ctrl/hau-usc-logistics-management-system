/* ===== styles/tokens.css ===== */
/* v2 — Kinetic Institutional Operations · token layer.

   The v1 defect this file fixes: --canvas and --paper were 1.5% apart in
   relative luminance, so nothing on a page had a figure/ground relationship
   and every surface read at one level. v2 opens a real surface ladder in both
   themes, raises the type scale, restores radius variety, and adds a
   documented motion system.

   Identity ramp is preserved from the v0.7.2 reference. */

:root {
  color-scheme: light;

  /* ---- Identity ramp (preserved) ---- */
  --ox-900: #40070a;
  --ox-800: #610b0f;
  --ox-700: #78141a;
  --ox-600: #8d1f28;
  --ox-500: #a62835;

  --gold-700: #7d5518;
  --gold-600: #a8761f;
  --gold-500: #c8992f;
  --gold-400: #e8b93c;
  --gold-300: #f2d15c;
  --gold-200: #f6e29a;
  --gold-100: #faeecb;

  /* ---- Surface ladder: ground < surface < raised < overlay ---- */
  --canvas: #e9e0d0; /* page ground — sunken, warm sand */
  --paper: #fffdf8; /* working surface */
  --paper-2: #f7f0e2; /* inset / secondary */
  --paper-3: #ffffff; /* elevated overlay */
  --cream: #f6ecda;

  --ink: #241416;
  --ink-2: #4e3a3e;
  /* Must clear 4.5:1 against the *ground* (#e9e0d0), not just paper — v2's
     ground is deliberately darker than v1's, which pushed the v1 value to
     4.23:1. Measured 4.82:1 on ground, 6.0:1 on paper. */
  --muted: #6f5a60;
  --line: #d8cbb6;
  --line-strong: #bda98c;
  --line-hair: #e6dcc9;
  --white: #ffffff;

  /* Compositional anchors — brand colour is a layout device in v2,
     not just a button fill. */
  --anchor: var(--ox-800);
  --anchor-soft: color-mix(in srgb, var(--ox-800) 8%, var(--paper));
  --anchor-line: color-mix(in srgb, var(--ox-800) 24%, var(--line));
  --accent: var(--gold-400);
  --accent-wash: color-mix(in srgb, var(--gold-300) 26%, var(--paper));
  --accent-line: color-mix(in srgb, var(--gold-500) 46%, var(--line));

  /* ---- Status tones: still exactly five ---- */
  --tone-neutral-fg: #5d4a4f;
  --tone-neutral-bg: #ece3d3;
  --tone-neutral-line: #cdbfa7;

  --tone-info-fg: #23557f;
  --tone-info-bg: #e4eefa;
  --tone-info-line: #b0cbe6;

  --tone-progress-fg: #7d5518;
  --tone-progress-bg: #fbeed2;
  --tone-progress-line: #dcbe8a;

  --tone-done-fg: #1f6b41;
  --tone-done-bg: #e2f3e9;
  --tone-done-line: #a8d3ba;

  --tone-alert-fg: #9c2630;
  --tone-alert-bg: #fbe6e8;
  --tone-alert-line: #e3aeb3;

  /* ---- Icon language (single brand ink preserved) ---- */
  --icon-ink: var(--ox-800);
  --icon-ink-muted: color-mix(in srgb, var(--ox-800) 66%, var(--muted));
  --icon-surface: color-mix(in srgb, var(--gold-200) 42%, var(--paper));
  --icon-surface-strong: color-mix(in srgb, var(--gold-200) 68%, var(--paper));
  --icon-border: color-mix(in srgb, var(--gold-500) 40%, var(--line));

  /* ---- Rail ---- */
  --rail-from: #6b0e13;
  --rail-to: #3d070a;
  --rail-ink: #f7ecd9;
  --rail-ink-dim: #d9bfae;
  --rail-line: rgba(242, 209, 92, 0.22);

  /* ---- Type: raised so sections assert ---- */
  --font-body: "Aptos", "Segoe UI Variable", "Segoe UI", "Candara",
    "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
  --font-display: Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;

  --t-2xs: 10px;
  --t-xs: 11px;
  --t-sm: 13px;
  --t-md: 15px;
  --t-lg: 20px; /* v1: 17 — section headings now assert */
  --t-xl: 30px;
  --t-2xl: 44px; /* v1: 32 — attention values carry the page */
  --t-display: clamp(34px, 3.6vw, 54px);
  --tracking-body: -0.01em;
  --tracking-tight: -0.022em;
  --tracking-label: 0.1em;

  /* ---- Space ---- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 56px;

  /* ---- Radius: variety restored, still no consumer-soft 20px on wide panels ---- */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-pill: 999px;

  /* ---- Elevation ladder ---- */
  --elev-1: 0 1px 2px rgba(64, 30, 34, 0.05), 0 2px 8px rgba(64, 30, 34, 0.05);
  --elev-2: 0 2px 6px rgba(64, 30, 34, 0.07), 0 10px 26px rgba(64, 30, 34, 0.08);
  --elev-3: 0 8px 20px rgba(64, 30, 34, 0.12), 0 28px 60px rgba(64, 30, 34, 0.16);
  --elev-inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);

  /* ---- Motion ---- */
  --m-instant: 120ms;
  --m-small: 200ms;
  --m-surface: 280ms;
  --m-overlay: 320ms;
  --m-reveal: 400ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);

  /* Compatibility aliases for rules carried over from v1. An undefined custom
     property makes the whole declaration invalid, so these must exist. */
  --dur-state: var(--m-instant);
  --dur-move: var(--m-surface);
  --elev-raised: var(--elev-2);
  --elev-raised-strong: var(--elev-3);

  /* ---- Layout ---- */
  --rail-w: 272px;
  --rail-w-collapsed: 76px;
  --content-max: 1520px;
  --focus-ring: 3px solid var(--gold-400);
}

/* ============================================================
   Dark — designed, not inverted.
   v1 defect fixed here: the rail was LIGHTER than the content ground, so
   navigation advanced and content receded. v2 orders luminance
   ground < rail < surface, so content sits above its ground.
   ============================================================ */

[data-theme="dark"] {
  color-scheme: dark;

  --ox-900: #4a1015;
  --ox-800: #8e3038;
  --ox-700: #a5424b;
  --ox-600: #b8535d;
  --ox-500: #c4626c;

  --gold-700: #c9a45f;
  --gold-600: #d9b56d;
  --gold-500: #e3c37f;
  --gold-400: #eed08a;
  --gold-300: #f2dca6;
  --gold-200: #f6e7c4;
  --gold-100: #faf1de;

  --canvas: #100b0c; /* deepest ground */
  --paper: #1f1719; /* working surface — above the rail */
  --paper-2: #281d20; /* raised */
  --paper-3: #312428; /* overlay */
  --cream: #e9dcc8;

  --ink: #f7efe6;
  --ink-2: #ddcbcd;
  --muted: #b3a0a4;
  --line: #3d2e31;
  --line-strong: #5b4449;
  --line-hair: #2c2124;
  --white: #ffffff;

  --anchor: var(--ox-700);
  --anchor-soft: color-mix(in srgb, var(--ox-700) 22%, var(--paper));
  --anchor-line: color-mix(in srgb, var(--ox-600) 42%, var(--line));
  --accent: var(--gold-400);
  --accent-wash: rgba(238, 208, 138, 0.12);
  --accent-line: rgba(238, 208, 138, 0.32);

  --tone-neutral-fg: #cbb9bc;
  --tone-neutral-bg: rgba(255, 255, 255, 0.07);
  --tone-neutral-line: rgba(255, 255, 255, 0.18);

  --tone-info-fg: #a8cbf0;
  --tone-info-bg: rgba(58, 104, 158, 0.26);
  --tone-info-line: rgba(168, 203, 240, 0.38);

  --tone-progress-fg: #eecb92;
  --tone-progress-bg: rgba(150, 103, 30, 0.28);
  --tone-progress-line: rgba(238, 203, 146, 0.38);

  --tone-done-fg: #9ad9b2;
  --tone-done-bg: rgba(45, 112, 72, 0.28);
  --tone-done-line: rgba(154, 217, 178, 0.36);

  --tone-alert-fg: #f6acb2;
  --tone-alert-bg: rgba(166, 52, 60, 0.30);
  --tone-alert-line: rgba(246, 172, 178, 0.36);

  --icon-ink: var(--gold-300);
  --icon-ink-muted: color-mix(in srgb, var(--gold-300) 62%, var(--muted));
  --icon-surface: rgba(242, 220, 166, 0.10);
  --icon-surface-strong: rgba(242, 220, 166, 0.18);
  --icon-border: rgba(227, 195, 127, 0.26);

  /* Rail sits between ground and surface. */
  --rail-from: #2c1013;
  --rail-to: #180a0c;
  --rail-ink: #f4e6d2;
  --rail-ink-dim: #c4a9ad;
  --rail-line: rgba(242, 220, 166, 0.16);

  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.32);
  --elev-2: 0 2px 6px rgba(0, 0, 0, 0.46), 0 10px 26px rgba(0, 0, 0, 0.44);
  --elev-3: 0 8px 20px rgba(0, 0, 0, 0.54), 0 28px 60px rgba(0, 0, 0, 0.6);
  --elev-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}


/* ===== styles/base.css ===== */
/* Base element and utility layer. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 320px;
  min-height: 100%;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
  letter-spacing: var(--tracking-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

button,
input,
select,
textarea {
  font: inherit;
  letter-spacing: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

svg {
  display: block;
}

a {
  color: var(--ox-700);
  text-underline-offset: 3px;
}

/* Oxblood on a near-black ground measures ~2.7:1. Links re-tone to gold. */
[data-theme="dark"] a {
  color: var(--gold-300);
}

:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 3px;
  border-radius: 3px;
}

/* Focus is never removed — only redirected to a visible ring. */
:focus:not(:focus-visible) {
  outline: none;
}

/* Narrow, deliberate exception. On a route change focus moves to the main
   region so screen readers land on the new surface. It is a programmatic
   landing target with tabindex="-1", not an interactive control, and the page
   heading already signals arrival — so the ring is suppressed here and only
   here. Every real control keeps it. */
#surface-main:focus,
#surface-main:focus-visible {
  outline: none;
}

.u-hidden {
  display: none !important;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  top: var(--s-2);
  left: var(--s-2);
  z-index: 200;
  padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--ox-800);
  color: var(--white);
  font-size: var(--t-sm);
  font-weight: 700;
  transform: translateY(-200%);
  transition: transform var(--dur-state) var(--ease);
}

.skip-link:focus-visible {
  transform: translateY(0);
}

.icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  color: var(--icon-ink);
}

.icon--sm {
  width: 15px;
  height: 15px;
}

.icon--muted {
  color: var(--icon-ink-muted);
}

/* Numerals are the only place weight 900 is permitted. */
.num {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
}

.label {
  color: var(--muted);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.muted {
  color: var(--muted);
}

.truncate {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wrap-anywhere {
  min-width: 0;
  overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ===== styles/shell.css ===== */
/* Preview chrome + application shell.
   Layout responds to the *frame* via container queries, so the viewport
   switcher reflows the real layout and browser resizing does too. */

/* ---------- Preview chrome (not part of the product design) ---------- */

.preview-bar {
  position: sticky;
  top: 0;
  z-index: 120;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-3);
  padding: 10px clamp(12px, 2vw, 20px);
  border-bottom: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
}

.preview-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  margin-right: auto;
  font-size: var(--t-sm);
  font-weight: 700;
}

.preview-bar__tag {
  padding: 3px 8px;
  border: 1px solid var(--gold-500);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--gold-300) 30%, transparent);
  color: var(--ox-800);
  font-size: var(--t-2xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

[data-theme="dark"] .preview-bar__tag {
  color: var(--gold-300);
}

.preview-group {
  display: flex;
  align-items: center;
  gap: var(--s-1);
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--canvas);
}

.preview-group > button {
  min-height: 32px;
  padding: 5px 10px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: var(--t-xs);
  font-weight: 700;
  transition: background var(--dur-state) var(--ease);
}

.preview-group > button:hover {
  background: var(--paper);
}

.preview-group > button[aria-pressed="true"] {
  background: var(--ox-800);
  color: var(--white);
}

.preview-select {
  min-height: 34px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--canvas);
  color: var(--ink);
  font-size: var(--t-xs);
  font-weight: 700;
}

/* ---------- Frame: the container-query root ---------- */

.frame {
  container-type: inline-size;
  container-name: app;
  position: relative;
  width: 100%;
  margin: 0 auto;
  background: var(--canvas);
  /* Width is deliberately not animated — that would thrash layout, and a
     preview width change should settle instantly so the result can be judged. */
}

.frame[data-viewport="tablet"] {
  max-width: 834px;
}

.frame[data-viewport="mobile"] {
  max-width: 390px;
}

.frame[data-viewport="tablet"],
.frame[data-viewport="mobile"] {
  border-inline: 1px solid var(--line-strong);
  box-shadow: var(--elev-raised);
}

/* ---------- Application shell ---------- */

.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 720px;
}

.shell[data-rail="collapsed"] {
  --rail-w: var(--rail-w-collapsed);
}

/* Rail */

.rail {
  position: sticky;
  /* --preview-bar-h is published by the preview chrome; it is 0 in any real
     integration, where the shell owns the full viewport. */
  top: var(--preview-bar-h, 0px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: calc(100vh - var(--preview-bar-h, 0px));
  max-height: calc(100vh - var(--preview-bar-h, 0px));
  min-height: 0;
  overflow: hidden;
  /* v2: rail sits between ground and working surface in both themes, so
     content advances and navigation recedes. */
  background: linear-gradient(168deg, var(--rail-from), var(--rail-to));
  border-right: 1px solid var(--rail-line);
  box-shadow: 1px 0 0 rgba(0, 0, 0, 0.06);
  color: var(--rail-ink);
}

/* A single gold hairline down the rail edge — a compositional device, not
   decoration: it marks where navigation ends and work begins. */
.rail::after {
  position: absolute;
  top: 12%;
  right: -1px;
  bottom: 12%;
  width: 1px;
  background: linear-gradient(
    180deg,
    transparent,
    color-mix(in srgb, var(--gold-400) 55%, transparent) 30%,
    color-mix(in srgb, var(--gold-400) 55%, transparent) 70%,
    transparent
  );
  content: "";
  pointer-events: none;
}

.rail__brand {
  display: grid;
  gap: 2px;
  padding: var(--s-5) var(--s-4) var(--s-4);
  border-bottom: 1px solid color-mix(in srgb, var(--gold-300) 22%, transparent);
}

.rail__marks {
  display: flex;
  gap: 6px;
  margin-bottom: var(--s-3);
}

.rail__mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--gold-300);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--ox-800);
  font-size: var(--t-2xs);
  font-weight: 900;
  letter-spacing: 0.06em;
}

/* In dark mode --paper is near-black and --ox-800 lightens, so the light-mode
   plaque would put dark red on dark. Invert the plaque instead. */
[data-theme="dark"] .rail__mark {
  background: rgba(255, 255, 255, 0.1);
  color: var(--gold-300);
}

.rail__name {
  color: var(--white);
  font-family: var(--font-display);
  font-size: 21px;
  line-height: 1.1;
}

.rail__scroll {
  display: grid;
  align-content: start;
  gap: var(--s-4);
  min-height: 0;
  padding: var(--s-4) var(--s-3);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}

.rail__section {
  display: grid;
  gap: 2px;
}

.rail__section > .label {
  padding: 0 var(--s-2) 6px;
  color: color-mix(in srgb, var(--cream) 76%, transparent);
  font-size: var(--t-2xs);
}

.nav-item {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  align-items: center;
  gap: var(--s-3);
  width: 100%;
  min-height: 44px;
  padding: 7px var(--s-2);
  border-radius: var(--r-sm);
  color: var(--cream);
  text-align: left;
  transition: background var(--dur-state) var(--ease);
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.09);
  color: var(--white);
}

.nav-item[aria-current="page"] {
  background: var(--gold-300);
  color: var(--ox-900);
  font-weight: 700;
}

.nav-item[aria-current="page"] .icon {
  color: var(--ox-800);
}

.nav-item .icon {
  color: var(--gold-300);
}

.nav-item__icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
}

.nav-item__text {
  min-width: 0;
  overflow: hidden;
  font-size: var(--t-sm);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rail__foot {
  display: grid;
  gap: var(--s-2);
  padding: var(--s-3);
  border-top: 1px solid color-mix(in srgb, var(--gold-300) 22%, transparent);
}

.scope-button {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 16px;
  align-items: center;
  gap: var(--s-2);
  width: 100%;
  min-height: 46px;
  padding: 6px var(--s-2);
  border: 1px solid color-mix(in srgb, var(--gold-300) 24%, transparent);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.05);
  color: var(--white);
  text-align: left;
  transition: background var(--dur-state) var(--ease);
}

.scope-button:hover {
  background: rgba(255, 255, 255, 0.12);
}

.scope-button__text {
  display: grid;
  min-width: 0;
}

.scope-button__text b {
  overflow: hidden;
  font-size: var(--t-xs);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scope-button__text span {
  overflow: hidden;
  color: var(--cream);
  font-size: var(--t-2xs);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.avatar {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--paper);
  color: var(--ox-800);
  font-size: var(--t-2xs);
  font-weight: 900;
}

[data-theme="dark"] .avatar {
  background: rgba(255, 255, 255, 0.12);
  color: var(--gold-300);
}

[data-theme="dark"] .account-button .avatar {
  background: var(--ox-700);
  color: var(--white);
}

/* Workspace */

.workspace {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-width: 0;
  background: var(--canvas);
}

.topbar {
  position: sticky;
  top: var(--preview-bar-h, 0px);
  z-index: 60;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-3);
  min-height: 62px;
  padding: 10px clamp(14px, 2.4vw, 28px);
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--elev-1);
}

.icon-button {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--icon-ink);
  transition: border-color var(--dur-state) var(--ease),
    background var(--dur-state) var(--ease);
}

.icon-button:hover {
  border-color: var(--line-strong);
  background: var(--canvas);
}

.icon-button--round {
  border-radius: 50%;
}

.search {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  width: 100%;
  max-width: 460px;
  min-height: 36px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--canvas);
}

.search input {
  min-width: 0;
  /* Fill the label so the measured control matches the visible target. */
  min-height: 34px;
  flex: 1;
  border: 0;
  background: none;
  outline: none;
  font-size: var(--t-sm);
}

.search kbd {
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--paper);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: var(--t-2xs);
}

.topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--s-2);
}

.notif {
  position: relative;
}

.notif__count {
  position: absolute;
  top: -5px;
  right: -5px;
  display: grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border: 2px solid var(--paper);
  border-radius: var(--r-pill);
  background: var(--ox-600);
  color: var(--white);
  font-size: 9px;
  font-weight: 900;
}

.account-button {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 36px;
  padding: 2px 6px 2px 2px;
  border-radius: var(--r-sm);
}

.account-button:hover {
  background: var(--canvas);
}

.account-button .avatar {
  background: var(--ox-800);
  color: var(--white);
}

.account-button__text {
  display: grid;
  text-align: left;
}

.account-button__text b {
  font-size: var(--t-sm);
}

.account-button__text span {
  color: var(--muted);
  font-size: var(--t-xs);
}

.main {
  min-width: 0;
  padding: var(--s-6) clamp(14px, 2.4vw, 28px) var(--s-10);
}

.main__inner {
  max-width: var(--content-max);
  margin: 0 auto;
}

/* Mobile drawer + bottom nav (hidden until the container is narrow) */

.rail__scrim {
  display: none;
}

.tabbar {
  display: none;
}


/* ===== styles/components.css ===== */
/* Component layer. Containers are earned: hairline rules by default,
   elevation reserved for genuinely floating layers. */

/* ---------- Page header ---------- */

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s-5);
  padding-bottom: var(--s-4);
  border-bottom: 1px solid var(--line);
}

.page-head__title {
  min-width: 0;
}

.page-head h1 {
  font-family: var(--font-display);
  font-size: var(--t-display);
  font-weight: 400;
  line-height: 1;
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}

.page-head p {
  margin-top: 6px;
  max-width: 62ch;
  color: var(--muted);
  font-size: var(--t-md);
}

.page-head__actions {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-wrap: wrap;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: var(--s-2);
  color: var(--muted);
  font-size: var(--t-xs);
  font-weight: 600;
}

.breadcrumbs b {
  color: var(--ink-2);
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--t-sm);
  font-weight: 700;
  transition: background var(--dur-state) var(--ease),
    border-color var(--dur-state) var(--ease);
}

.btn:hover {
  border-color: var(--gold-600);
  background: var(--cream);
}

[data-theme="dark"] .btn:hover {
  background: var(--paper-2);
}

.btn--primary {
  border-color: var(--ox-800);
  background: var(--ox-800);
  color: var(--white);
}

.btn--primary:hover {
  border-color: var(--ox-700);
  background: var(--ox-700);
}

.btn--primary .icon {
  color: var(--white);
}

.btn--quiet {
  border-color: transparent;
  background: none;
  color: var(--ink-2);
}

.btn--quiet:hover {
  border-color: var(--line);
  background: var(--paper);
}

.btn--danger {
  border-color: var(--tone-alert-line);
  background: var(--tone-alert-bg);
  color: var(--tone-alert-fg);
}

.btn--sm {
  min-height: 32px;
  padding: 5px 10px;
  font-size: var(--t-xs);
}

.btn[disabled],
.btn[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.45;
}

.btn[data-state="loading"] .icon {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- Status chip: five tones, always labelled ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border: 1px solid var(--tone-neutral-line);
  border-radius: var(--r-pill);
  background: var(--tone-neutral-bg);
  color: var(--tone-neutral-fg);
  font-size: var(--t-xs);
  font-weight: 700;
  white-space: nowrap;
}

.chip[data-tone="info"] {
  border-color: var(--tone-info-line);
  background: var(--tone-info-bg);
  color: var(--tone-info-fg);
}

.chip[data-tone="progress"] {
  border-color: var(--tone-progress-line);
  background: var(--tone-progress-bg);
  color: var(--tone-progress-fg);
}

.chip[data-tone="done"] {
  border-color: var(--tone-done-line);
  background: var(--tone-done-bg);
  color: var(--tone-done-fg);
}

.chip[data-tone="alert"] {
  border-color: var(--tone-alert-line);
  background: var(--tone-alert-bg);
  color: var(--tone-alert-fg);
}

.chip .icon {
  width: 13px;
  height: 13px;
  color: currentColor;
}

/* ---------- Attention band ---------- */

/* The attention band is the page's visual anchor in v2. In v1 it was a flat
   strip that read at the same level as the table beneath it. */
.attention {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-top: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  box-shadow: var(--elev-2);
  overflow: hidden;
}

/* No side stripe. A thick coloured bar down one edge of a card is a stock
   AI-UI tell; the band already reads as the page anchor through elevation,
   the display-serif numerals, and the alert-toned urgent cell. */

.attention__item {
  display: grid;
  align-content: start;
  gap: 4px;
  padding: var(--s-5) var(--s-5) var(--s-4);
  border-left: 1px solid var(--line-hair);
  text-align: left;
  transition:
    background-color var(--m-instant) var(--ease),
    box-shadow var(--m-small) var(--ease);
}

.attention__item:first-child {
  border-left: 0;
}

.attention__item:hover {
  background: var(--accent-wash);
  box-shadow: inset 0 -3px 0 var(--accent);
}

.attention__label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.04em;
}

.attention__value {
  font-family: var(--font-display);
  font-size: var(--t-2xl);
  font-weight: 400;
  letter-spacing: var(--tracking-tight);
  line-height: 1;
}

/* Urgency reads as urgent — but the note text still carries the meaning, so
   this is reinforcement, never colour-only. */
.attention__item[data-urgent="true"] {
  background: var(--tone-alert-bg);
}

.attention__item[data-urgent="true"] .attention__value,
.attention__item[data-urgent="true"] .attention__label {
  color: var(--tone-alert-fg);
}

.attention__item[data-urgent="true"]:hover {
  box-shadow: inset 0 -3px 0 var(--tone-alert-fg);
}

.attention__note {
  color: var(--muted);
  font-size: var(--t-xs);
}

.context-line {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-5);
  margin-top: var(--s-3);
  color: var(--muted);
  font-size: var(--t-xs);
}

.context-line b {
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* ---------- Section ---------- */

.section {
  margin-top: var(--s-8);
}

/* Editorial section rule: a short oxblood anchor followed by a hairline.
   Replaces v1's uniform full-width hairline, which made every section equal. */
.section__head {
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-4);
  padding-bottom: var(--s-3);
  border-bottom: 1px solid var(--line-hair);
}

.section__head::after {
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 56px;
  height: 2px;
  background: var(--anchor);
  content: "";
}

.section__head h2 {
  font-family: var(--font-display);
  font-size: var(--t-lg);
  font-weight: 400;
  letter-spacing: var(--tracking-tight);
}

.section__head h3 {
  font-size: var(--t-md);
  font-weight: 700;
}

/* Panel-level heading. Always an <h2> so the outline stays h1 -> h2 -> h3. */
.block-title {
  margin-bottom: var(--s-3);
  color: var(--muted);
  font-size: var(--t-sm);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

/* Panels are a raised working surface over the sunken ground — v1 made them
   flat, which is why nothing had depth. */
.panel {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: var(--elev-1);
}

.panel__body {
  padding: var(--s-4);
}

/* ---------- Queue table ---------- */

/* A queue is a working surface, not bare text on the page ground. */
.table-wrap {
  width: 100%;
  min-width: 0;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: var(--elev-1);
}

/* Nested inside an existing surface it must not double up. */
.panel .table-wrap,
.detail__body .table-wrap {
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

table.q caption {
  padding: var(--s-3) var(--s-4) var(--s-2);
}

table.q thead th:first-child,
table.q tbody th:first-child,
table.q tbody td:first-child {
  padding-left: var(--s-4);
}

table.q thead th:last-child,
table.q tbody td:last-child {
  padding-right: var(--s-4);
}

table.q tbody tr:last-child th,
table.q tbody tr:last-child td {
  border-bottom: 0;
}

.panel table.q caption,
.detail__body table.q caption {
  padding-inline: 0;
}

.panel table.q :is(th, td):first-child,
.detail__body table.q :is(th, td):first-child {
  padding-left: 10px;
}

table.q {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-sm);
}

table.q caption {
  padding-bottom: var(--s-2);
  color: var(--muted);
  font-size: var(--t-xs);
  text-align: left;
}

/* Scoped to thead: a row header (<th scope="row">) is content, not a column
   label, and must not inherit the uppercase micro-label treatment. */
table.q thead th {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-strong);
  color: var(--muted);
  font-size: var(--t-2xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

table.q td,
table.q tbody th {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

table.q tbody th {
  color: var(--ink);
  font-size: var(--t-sm);
  font-weight: 700;
  letter-spacing: var(--tracking-body);
  text-align: left;
  text-transform: none;
}

table.q tbody tr {
  transition: background var(--dur-state) var(--ease);
}

table.q tbody tr:hover {
  background: var(--cream);
}

[data-theme="dark"] table.q tbody tr:hover {
  background: var(--paper-2);
}

/* The selected row grows an oxblood spine that visually connects it to the
   detail pane beside it. */
table.q tbody tr[aria-selected="true"] {
  background: var(--accent-wash);
  box-shadow: inset 4px 0 0 var(--anchor);
}

[data-theme="dark"] table.q tbody tr[aria-selected="true"] {
  background: var(--accent-wash);
  box-shadow: inset 4px 0 0 var(--gold-400);
}

.q__link {
  display: grid;
  gap: 2px;
  width: 100%;
  text-align: left;
}

.q__link b {
  color: var(--ink);
  font-size: var(--t-sm);
}

.q__link span {
  color: var(--muted);
  font-size: var(--t-xs);
}

.q__num {
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.q__ref {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  white-space: nowrap;
}

/* Dates are atomic: a wrapped "2026-08-\n19" is harder to scan than a
   slightly narrower column. */
.q__date {
  white-space: nowrap;
}

/* Column priority: which columns survive a narrow container. */
.col-p3 { /* first to go */ }
.col-p2 { /* second to go */ }

/* ---------- Split pane ---------- */

/* The queue keeps the larger share. v2's detail pane carries more padding than
   v1's, and an even split pushed queue titles and dates onto second lines. */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1.32fr) minmax(360px, 0.68fr);
  gap: var(--s-5);
  align-items: start;
  margin-top: var(--s-5);
}

.split__detail {
  position: sticky;
  top: calc(var(--preview-bar-h, 0px) + 76px);
  /* Without this the grid item's automatic minimum size is the detail table's
     min-content width, which pushes the pane past the viewport. */
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  /* The detail pane is the active working surface — it sits above the queue. */
  box-shadow: var(--elev-2);
}

.detail__body > * {
  min-width: 0;
}

/* The detail head is the working context: it reads as a header, not as more
   table. The anchor wash ties it to the selected row's oxblood spine. */
.detail__head {
  display: grid;
  gap: var(--s-2);
  padding: var(--s-5);
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: linear-gradient(160deg, var(--anchor-soft), transparent 70%);
}

.detail__title h2 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: var(--tracking-tight);
}

.detail__title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-3);
}

.detail__title h2 {
  font-size: var(--t-lg);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.detail__body {
  display: grid;
  gap: var(--s-5);
  max-height: min(62vh, 640px);
  padding: var(--s-4);
  overflow-y: auto;
}

.detail__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-4);
  border-top: 1px solid var(--line);
  background: var(--paper-2);
  border-radius: 0 0 var(--r-md) var(--r-md);
}

.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-3) var(--s-4);
  margin: 0;
}

.facts > div {
  min-width: 0;
}

.facts dt {
  color: var(--muted);
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.facts dd {
  margin: 3px 0 0;
  font-size: var(--t-sm);
  overflow-wrap: anywhere;
}

/* ---------- Drawer ---------- */

.drawer-scrim {
  position: fixed;
  inset: 0;
  z-index: 130;
  background: rgba(20, 10, 12, 0.55);
  border: 0;
  animation: fade-in var(--dur-state) var(--ease);
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 140;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: min(560px, 100%);
  background: var(--paper);
  box-shadow: var(--elev-raised-strong);
  animation: slide-in var(--dur-move) var(--ease);
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

@keyframes slide-in {
  from {
    transform: translateX(4%);
    opacity: 0;
  }
}

/* ---------- Dialog ---------- */

.dialog {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: grid;
  place-items: center;
  padding: var(--s-4);
}

.dialog__panel {
  position: relative;
  z-index: 1;
  width: min(460px, 100%);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: var(--elev-raised-strong);
}

.dialog__body {
  display: grid;
  gap: var(--s-2);
  padding: var(--s-5);
}

.dialog__body h3 {
  font-size: var(--t-lg);
  font-weight: 700;
}

.dialog__foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-top: 1px solid var(--line);
}

/* ---------- Menu ---------- */

.menu {
  position: absolute;
  top: 52px;
  right: clamp(14px, 2.4vw, 28px);
  z-index: 100;
  display: grid;
  gap: 2px;
  width: 214px;
  padding: 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--paper);
  box-shadow: var(--elev-raised);
}

.menu button {
  padding: 9px 10px;
  border-radius: 6px;
  color: var(--ink);
  font-size: var(--t-sm);
  text-align: left;
}

.menu button:hover {
  background: var(--cream);
}

[data-theme="dark"] .menu button:hover {
  background: var(--paper-2);
}

/* ---------- Forms ---------- */

.field {
  display: grid;
  gap: 5px;
}

.field > label {
  font-size: var(--t-sm);
  font-weight: 700;
}

.field__hint {
  color: var(--muted);
  font-size: var(--t-xs);
}

/* Every text-like control, including password, search, file and tel.
   Listing types individually silently drops the ones you forget. */
.field input:not([type="checkbox"]):not([type="radio"]),
.field select,
.field textarea {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  min-height: 42px;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--paper);
  font-size: var(--t-sm);
}

/* File inputs carry a large intrinsic minimum width that overflows narrow
   containers unless it is explicitly overridden. */
.field input[type="file"] {
  padding: 8px 10px;
}

/* 24px is the WCAG 2.2 AA minimum target size. */
input[type="checkbox"],
input[type="radio"] {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  accent-color: var(--ox-800);
}

.field textarea {
  min-height: 88px;
  resize: vertical;
}

.field[data-invalid="true"] input,
.field[data-invalid="true"] select,
.field[data-invalid="true"] textarea {
  border-color: var(--tone-alert-fg);
  background: var(--tone-alert-bg);
}

.field__error {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--tone-alert-fg);
  font-size: var(--t-xs);
  font-weight: 700;
}

.field__error .icon {
  color: currentColor;
}

.form-grid {
  display: grid;
  gap: var(--s-4);
  max-width: 640px;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-3);
}

fieldset {
  margin: 0;
  padding: var(--s-4);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}

legend {
  padding: 0 6px;
  font-size: var(--t-sm);
  font-weight: 700;
}

/* ---------- Stepper ---------- */

.stepper {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  margin-bottom: var(--s-5);
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepper li {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px 5px 5px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  color: var(--muted);
  font-size: var(--t-xs);
  font-weight: 700;
}

.stepper li::before {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--canvas);
  color: var(--muted);
  content: counter(step);
  counter-increment: step;
  font-variant-numeric: tabular-nums;
}

.stepper li[aria-current="step"] {
  border-color: var(--ox-800);
  background: var(--paper);
  color: var(--ink);
}

.stepper li[aria-current="step"]::before {
  background: var(--ox-800);
  color: var(--white);
}

.stepper li[data-done="true"]::before {
  background: var(--tone-done-fg);
  color: var(--white);
  content: "\2713";
}

/* ---------- Timeline ---------- */

.timeline {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.timeline li {
  position: relative;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: var(--s-3);
  padding-bottom: var(--s-4);
}

.timeline li:not(:last-child)::before {
  position: absolute;
  top: 20px;
  bottom: 0;
  left: 10px;
  width: 1px;
  background: var(--line-strong);
  content: "";
}

.timeline__dot {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 2px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper);
}

.timeline li[data-done="true"] .timeline__dot {
  border-color: var(--tone-done-fg);
  background: var(--tone-done-fg);
}

.timeline li[data-done="true"] .timeline__dot .icon {
  width: 11px;
  height: 11px;
  color: var(--white);
}

.timeline li[data-current="true"] .timeline__dot {
  border-color: var(--ox-800);
  box-shadow: inset 0 0 0 3px var(--paper);
  background: var(--ox-800);
}

.timeline__body b {
  display: block;
  font-size: var(--t-sm);
}

.timeline__body span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: var(--t-xs);
}

/* ---------- Ledger ---------- */

.ledger {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-xs);
}

.ledger th,
.ledger td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}

.ledger th {
  color: var(--muted);
  font-size: var(--t-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.ledger td:last-child,
.ledger th:last-child {
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.ledger__in {
  color: var(--tone-done-fg);
  font-weight: 700;
}

.ledger__out {
  color: var(--tone-alert-fg);
  font-weight: 700;
}

/* ---------- Quantity ---------- */

.qty {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  font-variant-numeric: tabular-nums;
}

.qty b {
  font-size: var(--t-md);
  font-weight: 900;
}

.qty span {
  color: var(--muted);
  font-size: var(--t-xs);
}

.meter {
  display: block;
  width: 100%;
  max-width: 140px;
  height: 5px;
  margin-top: 5px;
  border-radius: var(--r-pill);
  background: var(--line);
  overflow: hidden;
}

.meter > span {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--ox-600);
  transform-origin: left center;
}

.meter[data-tone="done"] > span {
  background: var(--tone-done-fg);
}

.meter[data-tone="alert"] > span {
  background: var(--tone-alert-fg);
}

.meter[data-tone="progress"] > span {
  background: var(--gold-600);
}

/* ---------- Composition bar (replaces the decorative donut) ---------- */

.composition {
  display: flex;
  width: 100%;
  height: 12px;
  border-radius: var(--r-pill);
  overflow: hidden;
}

.composition > span {
  height: 100%;
}

.composition-key {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.composition-key li {
  display: grid;
  grid-template-columns: 9px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-2);
  font-size: var(--t-xs);
}

.composition-key i {
  width: 9px;
  height: 9px;
  border-radius: 2px;
}

.composition-key b {
  font-variant-numeric: tabular-nums;
}

/* ---------- Evidence ---------- */

.evidence {
  display: grid;
  gap: var(--s-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.evidence li {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}

.evidence__mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--icon-border);
  border-radius: var(--r-sm);
  background: var(--icon-surface);
}

.evidence b {
  display: block;
  font-size: var(--t-xs);
  overflow-wrap: anywhere;
}

.evidence span {
  display: block;
  color: var(--muted);
  font-size: var(--t-2xs);
}

/* ---------- States ---------- */

.state {
  display: grid;
  justify-items: center;
  gap: var(--s-2);
  padding: var(--s-10) var(--s-5);
  text-align: center;
}

.state__mark {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--icon-border);
  border-radius: 50%;
  background: var(--icon-surface);
}

.state h2 {
  font-size: var(--t-md);
  font-weight: 700;
}

.state p {
  max-width: 46ch;
  color: var(--muted);
  font-size: var(--t-sm);
}

.notice {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--tone-info-line);
  border-radius: var(--r-md);
  background: var(--tone-info-bg);
  color: var(--tone-info-fg);
  font-size: var(--t-sm);
}

.notice .icon {
  color: currentColor;
}

.notice b {
  display: block;
}

.notice p {
  margin-top: 3px;
  color: inherit;
  opacity: 0.92;
}

.notice[data-tone="alert"] {
  border-color: var(--tone-alert-line);
  background: var(--tone-alert-bg);
  color: var(--tone-alert-fg);
}

.notice[data-tone="progress"] {
  border-color: var(--tone-progress-line);
  background: var(--tone-progress-bg);
  color: var(--tone-progress-fg);
}

.notice[data-tone="done"] {
  border-color: var(--tone-done-line);
  background: var(--tone-done-bg);
  color: var(--tone-done-fg);
}

/* Skeleton */

.skeleton {
  border-radius: 5px;
  background: linear-gradient(
    90deg,
    var(--line) 25%,
    color-mix(in srgb, var(--line) 45%, var(--paper)) 50%,
    var(--line) 75%
  );
  background-size: 240% 100%;
  animation: skeleton 1.3s linear infinite;
}

@keyframes skeleton {
  to {
    background-position: -240% 0;
  }
}

/* ---------- Receipt ---------- */

.receipt {
  max-width: 560px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--paper);
}

.receipt__head {
  display: grid;
  gap: 5px;
  padding: var(--s-5);
  border-bottom: 1px dashed var(--line-strong);
  text-align: center;
}

.receipt__ref {
  font-family: var(--font-mono);
  font-size: var(--t-xl);
  font-weight: 900;
  letter-spacing: 0.02em;
}

.receipt__body {
  display: grid;
  gap: var(--s-4);
  padding: var(--s-5);
}

/* ---------- Toast ---------- */

.toast-region {
  position: fixed;
  right: var(--s-5);
  bottom: var(--s-5);
  z-index: 160;
  display: grid;
  gap: var(--s-2);
  max-width: min(360px, calc(100% - 32px));
}

.toast {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: var(--s-2);
  padding: 11px 13px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--ox-800);
  color: var(--white);
  box-shadow: var(--elev-raised);
  font-size: var(--t-sm);
  animation: toast-in var(--dur-move) var(--ease);
}

.toast .icon {
  color: var(--gold-300);
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

/* ---------- Sticky mobile action bar ---------- */

.action-bar {
  display: none;
}

/* ---------- Illustrative-data marker ---------- */

.illustrative {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: var(--t-2xs);
  font-style: italic;
}


/* ===== styles/surfaces.css ===== */
/* Public / pre-authentication surfaces and the surface index.
   Public is calmer, narrower and larger than internal by design. */

.public {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: 720px;
  background: var(--canvas);
}

.public__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  padding: var(--s-3) clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--elev-1);
}

.public__bar-actions {
  display: flex;
  align-items: center;
  gap: var(--s-2);
}

.public__brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-width: 0;
}

.public__marks {
  display: flex;
  gap: 5px;
}

.public__mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--gold-500);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--ox-800);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.05em;
}

[data-theme="dark"] .public__mark {
  background: rgba(255, 255, 255, 0.1);
  color: var(--gold-300);
}

.public__wordmark b {
  display: block;
  font-family: var(--font-display);
  font-size: var(--t-lg);
  font-weight: 400;
  line-height: 1.15;
}

.public__wordmark span {
  display: block;
  color: var(--muted);
  font-size: var(--t-xs);
}

.public__main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 40px) var(--s-10);
}

.public__main--wide {
  max-width: 1000px;
}

.public__head {
  margin-bottom: var(--s-6);
}

.public__head h1 {
  font-family: var(--font-display);
  font-size: clamp(32px, 4.4vw, 48px);
  font-weight: 400;
  line-height: 1.02;
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}

.public__head p {
  margin-top: var(--s-3);
  max-width: 58ch;
  color: var(--ink-2);
  font-size: var(--t-lg);
}

.public__foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--s-3);
  padding: var(--s-5) clamp(16px, 4vw, 40px);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: var(--t-xs);
}

/* Portal selector cards — heterogeneous choices, so cards are earned here. */

/* The lead action takes the full first row. v1 gave four identical cards, so
   nothing told a first-time visitor where to start. */
.portal-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--s-3);
}

/* The lead action runs the full width as a horizontal row, so it reads as the
   primary path rather than as a taller version of the same card. */
.portal-grid > :first-child {
  grid-column: 1 / -1;
  grid-template-columns: 56px minmax(0, 1fr);
  grid-template-areas:
    "mark title"
    "mark sub";
  align-items: center;
  column-gap: var(--s-5);
  row-gap: 2px;
  padding: var(--s-5) var(--s-6);
  border-color: var(--anchor-line);
  background: linear-gradient(118deg, var(--anchor-soft), var(--paper) 62%);
}

.portal-grid > :first-child .portal-card__mark {
  grid-area: mark;
  align-self: center;
}

.portal-grid > :first-child b {
  grid-area: title;
}

.portal-grid > :first-child span {
  grid-area: sub;
}

.portal-grid > :first-child b {
  font-family: var(--font-display);
  font-size: var(--t-xl);
  font-weight: 400;
  letter-spacing: var(--tracking-tight);
}

.portal-grid > :first-child .portal-card__mark {
  width: 48px;
  height: 48px;
  border-color: var(--accent-line);
  background: var(--icon-surface-strong);
}

@container app (max-width: 640px) {
  .portal-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  /* Back to a stacked card so the mark and title do not crush at 320px. */
  .portal-grid > :first-child {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "mark" "title" "sub";
    align-items: start;
    row-gap: var(--s-2);
    padding: var(--s-5);
  }
}

.portal-card {
  display: grid;
  align-content: start;
  gap: var(--s-2);
  padding: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper);
  /* A card is a destination, not inline link text — keep body ink. */
  color: var(--ink);
  text-decoration: none;
  text-align: left;
  transition: border-color var(--dur-state) var(--ease),
    background var(--dur-state) var(--ease);
}

.portal-card:hover {
  border-color: var(--gold-600);
  background: var(--cream);
}

[data-theme="dark"] .portal-card:hover {
  background: var(--paper-2);
}

.portal-card__mark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--icon-border);
  border-radius: var(--r-sm);
  background: var(--icon-surface);
}

.portal-card b {
  font-size: var(--t-md);
}

.portal-card span {
  color: var(--muted);
  font-size: var(--t-sm);
}

/* Auth card */

.auth-card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: var(--s-6);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper);
}

.auth-card h1 {
  font-family: var(--font-display);
  font-size: var(--t-xl);
  font-weight: 400;
}

.auth-card > p {
  margin-top: 6px;
  color: var(--muted);
  font-size: var(--t-sm);
}

.auth-card form {
  display: grid;
  gap: var(--s-4);
  margin-top: var(--s-5);
}

.auth-alt {
  margin-top: var(--s-4);
  padding-top: var(--s-4);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: var(--t-sm);
  text-align: center;
}

/* ---------- Surface index ---------- */

.index-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--s-8) clamp(16px, 4vw, 32px) var(--s-10);
}

.index-wrap h1 {
  font-family: var(--font-display);
  font-size: var(--t-2xl);
  font-weight: 400;
  letter-spacing: -0.02em;
}

.index-wrap > p {
  margin-top: var(--s-2);
  max-width: 70ch;
  color: var(--muted);
}

.index-group {
  margin-top: var(--s-6);
}

.index-group h2 {
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-sm);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.index-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--s-2);
  margin-top: var(--s-3);
}

.index-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-2);
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
  text-align: left;
  transition: border-color var(--dur-state) var(--ease),
    background var(--dur-state) var(--ease);
}

.index-item:hover {
  border-color: var(--gold-600);
  background: var(--cream);
}

[data-theme="dark"] .index-item:hover {
  background: var(--paper-2);
}

.index-item b {
  display: block;
  font-size: var(--t-sm);
  font-weight: 700;
}

.index-item span {
  display: block;
  color: var(--muted);
  font-size: var(--t-xs);
}

.index-tier {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.index-tier[data-tier="deep"] {
  border-color: var(--gold-600);
  color: var(--gold-700);
}

[data-theme="dark"] .index-tier[data-tier="deep"] {
  color: var(--gold-300);
}

/* Two-column supporting rails on overview surfaces */

.rails {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--s-6);
  margin-top: var(--s-6);
}

/* Deliberate asymmetry. v1 gave the three overview rails identical width, so
   none of them led. Activity is the widest, readiness next, composition
   narrowest — matching how often each is actually read. */
.rails--overview {
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1.15fr);
}

@container app (max-width: 1023px) {
  .rails--overview {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .rails--overview > *:first-child {
    grid-column: 1 / -1;
  }
}

@container app (max-width: 767px) {
  .rails--overview,
  .rails--overview > *:first-child {
    grid-column: auto;
    grid-template-columns: minmax(0, 1fr);
  }
}

.rail-block {
  display: grid;
  align-content: start;
  gap: var(--s-3);
}

.rail-block__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

.rail-block__head h3 {
  font-size: var(--t-sm);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.stack-list {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.stack-list > li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-3);
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-sm);
}

.stack-list > li:last-child {
  border-bottom: 0;
}

.stack-list b {
  display: block;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.stack-list span {
  display: block;
  color: var(--muted);
  font-size: var(--t-xs);
}

.health-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--s-3);
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-sm);
}

.health-row:last-child {
  border-bottom: 0;
}


/* ===== styles/motion.css ===== */
/* v2 motion system.

   Every animation here answers one question: what does it communicate?
   Allowed answers: navigation, state, relationship, hierarchy, completion,
   attention, progressive disclosure. Nothing ships on "it looks cool".

   Budget: at most one continuous animation per visible viewport, preferably
   zero. The only continuous animation in this system is the live status dot,
   which reports a genuinely live connection.

   Timings come from tokens.css:
     --m-instant 120ms   feedback
     --m-small   200ms   component motion
     --m-surface 280ms   surface transition
     --m-overlay 320ms   drawer / modal
     --m-reveal  400ms   staged reveal
   Easing is --ease cubic-bezier(.22,1,.36,1). No bounce. */

/* ---------- Theme transition ----------
   Communicates: the whole surface changed deliberately, not by a flash.
   Scoped to colour properties only so layout never animates. */

.theme-anim,
.theme-anim .rail,
.theme-anim .topbar,
.theme-anim .panel,
.theme-anim .attention,
.theme-anim .split__detail,
.theme-anim table.q tbody tr,
.theme-anim .public__bar,
.theme-anim .public,
.theme-anim .btn,
.theme-anim .chip {
  transition:
    background-color var(--m-surface) var(--ease),
    border-color var(--m-surface) var(--ease),
    color var(--m-surface) var(--ease),
    box-shadow var(--m-surface) var(--ease);
}

/* ---------- Theme toggle icon ----------
   Communicates: current theme state, and that pressing it transforms rather
   than replaces. Sun in light, moon in dark. */

.theme-toggle {
  position: relative;
  overflow: hidden;
}

.theme-toggle__icons {
  position: relative;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
}

.theme-toggle__icons > svg {
  position: absolute;
  inset: 0;
  width: 20px;
  height: 20px;
  color: var(--gold-600);
  transition:
    transform var(--m-small) var(--ease),
    opacity var(--m-small) var(--ease);
}

[data-theme="dark"] .theme-toggle__icons > svg {
  color: var(--gold-300);
}

/* Light: sun present, moon rotated away below. */
.theme-toggle__sun {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.theme-toggle__moon {
  opacity: 0;
  transform: rotate(-90deg) scale(0.4);
}

/* Dark: moon rotates in, sun rotates out. */
[data-theme="dark"] .theme-toggle__sun {
  opacity: 0;
  transform: rotate(90deg) scale(0.4);
}

[data-theme="dark"] .theme-toggle__moon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.theme-toggle:hover .theme-toggle__icons > svg {
  transform: rotate(0deg) scale(1.08);
}

/* Hover nudges only the icon that is actually visible; the hidden one keeps
   its rotated-away position so the crossfade stays clean. */
.theme-toggle:hover .theme-toggle__moon {
  transform: rotate(-90deg) scale(0.4);
}

[data-theme="dark"] .theme-toggle:hover .theme-toggle__sun {
  transform: rotate(90deg) scale(0.4);
}

[data-theme="dark"] .theme-toggle:hover .theme-toggle__moon {
  transform: rotate(0deg) scale(1.08);
}

/* ---------- Surface transition ----------
   Communicates: navigation. A new surface arrives rather than blinking in. */

.surface-enter {
  animation: surface-in var(--m-surface) var(--ease) both;
}

@keyframes surface-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

/* ---------- Staged reveal ----------
   Communicates: reading order — title, then attention, then work queue, then
   supporting rails. Runs on surface change only, never on scroll. */

.stage > * {
  animation: stage-in var(--m-reveal) var(--ease) both;
}

.stage > *:nth-child(1) { animation-delay: 0ms; }
.stage > *:nth-child(2) { animation-delay: 40ms; }
.stage > *:nth-child(3) { animation-delay: 80ms; }
.stage > *:nth-child(4) { animation-delay: 120ms; }
.stage > *:nth-child(5) { animation-delay: 160ms; }
.stage > *:nth-child(n + 6) { animation-delay: 200ms; }

@keyframes stage-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}

/* ---------- Navigation active indicator ----------
   Communicates: which route is active, and that the selection moved rather
   than teleported. Transform-driven, so no layout animation. */

.nav-item {
  position: relative;
}

/* Scaled, not resized: animating height thrashes layout. */
.nav-item::before {
  position: absolute;
  top: 19%;
  left: 0;
  width: 3px;
  height: 62%;
  border-radius: 0 3px 3px 0;
  background: var(--gold-300);
  content: "";
  transform: scaleY(0);
  transform-origin: center;
  transition: transform var(--m-small) var(--ease);
}

.nav-item[aria-current="page"]::before {
  transform: scaleY(1);
}

/* ---------- Metric emphasis ----------
   Communicates: this figure just changed. Fires on state change only —
   never a counting loop, and never implies live data. */

.metric-change {
  animation: metric-ack var(--m-reveal) var(--ease) both;
}

@keyframes metric-ack {
  0% {
    transform: translateY(6px);
    opacity: 0.4;
  }
  60% {
    transform: translateY(-2px);
    opacity: 1;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ---------- Progress / readiness ----------
   Communicates: progress moved from a previous value to a new one. */

/* Scaled, not resized — same reason as the nav indicator. */
.meter > span {
  transition: transform var(--m-reveal) var(--ease);
}

/* ---------- Row state ----------
   Communicates: selection, and that the detail beside it belongs to this row. */

table.q tbody tr {
  transition:
    background-color var(--m-instant) var(--ease),
    box-shadow var(--m-small) var(--ease);
}

table.q tbody tr[aria-selected="true"] {
  animation: row-select var(--m-small) var(--ease) both;
}

@keyframes row-select {
  from {
    box-shadow: inset 0 0 0 var(--anchor);
  }
}

/* ---------- Buttons ----------
   Communicates: pressability, then acknowledgement. */

.btn {
  transition:
    background-color var(--m-instant) var(--ease),
    border-color var(--m-instant) var(--ease),
    color var(--m-instant) var(--ease),
    box-shadow var(--m-small) var(--ease),
    transform var(--m-instant) var(--ease);
}

.btn:hover:not([disabled]):not([aria-disabled="true"]) {
  transform: translateY(-1px);
}

.btn:active:not([disabled]):not([aria-disabled="true"]) {
  transform: translateY(0.5px);
}

.btn--danger:hover {
  /* Destructive actions do not get a playful lift. */
  transform: none;
}

/* ---------- Overlays ----------
   Communicates: a layer arrived above the current context. */

.drawer {
  animation: drawer-in var(--m-overlay) var(--ease) both;
}

@keyframes drawer-in {
  from {
    opacity: 0;
    transform: translateX(24px);
  }
}

.dialog__panel {
  animation: dialog-in var(--m-overlay) var(--ease) both;
}

@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.985);
  }
}

.drawer-scrim {
  animation: scrim-in var(--m-small) var(--ease) both;
}

@keyframes scrim-in {
  from {
    opacity: 0;
  }
}

.menu {
  animation: menu-in var(--m-small) var(--ease) both;
  transform-origin: top right;
}

@keyframes menu-in {
  from {
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
  }
}

/* ---------- Toast ----------
   Communicates: completion. Slide and fade, never bounce. */

.toast {
  animation: toast-in var(--m-overlay) var(--ease) both;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}

/* ---------- Live status dot ----------
   The single permitted continuous animation. It reports a genuinely live
   connection; remove it wherever the state is not actually live. */

.live-dot {
  position: relative;
  display: inline-grid;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--tone-done-fg);
}

.live-dot::after {
  position: absolute;
  inset: -3px;
  border: 1px solid var(--tone-done-fg);
  border-radius: 50%;
  content: "";
  opacity: 0;
  animation: live-pulse 2.6s var(--ease) infinite;
}

@keyframes live-pulse {
  0% {
    opacity: 0.6;
    transform: scale(0.7);
  }
  70%,
  100% {
    opacity: 0;
    transform: scale(1.5);
  }
}

/* ---------- Reduced motion ----------
   Spatial movement is removed. State feedback is kept, near-instant, so the
   interface never becomes less informative — only less kinetic. */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  /* The icon still swaps — only the rotation is dropped. The existing
     light/dark opacity rules decide which glyph is visible. */
  .theme-toggle__icons > svg {
    transition: opacity 0.01ms !important;
    transform: none !important;
  }

  .live-dot::after {
    display: none;
  }

  .btn:hover,
  .btn:active {
    transform: none !important;
  }
}


/* ===== styles/responsive.css ===== */
/* Responsive layer — driven by container queries on `.frame`, so the preview's
   viewport switcher reflows the real layout and browser resizing does too.
   `container-type: inline-size` also makes `.frame` the containing block for
   fixed-position descendants, which keeps the mobile drawer, tab bar and
   action bar inside the simulated device.

   Priority rule from the brief: narrow layouts REORDER and STACK.
   Operational columns (status, quantity, readiness) survive;
   reference ids and secondary metadata are the first to go. */

/* ---- 1180px: detail leaves the split and becomes a drawer ---- */
@container app (max-width: 1180px) {
  .split {
    grid-template-columns: minmax(0, 1fr);
  }

  .split__detail {
    display: none;
  }

  .split[data-detail-mode="inline"] .split__detail {
    display: block;
    position: static;
  }
}

/* ---- 1023px: rail goes off-canvas ---- */
@container app (max-width: 1023px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
  }

  .rail {
    position: fixed;
    top: var(--preview-bar-h, 0px);
    bottom: 0;
    left: 0;
    z-index: 140;
    width: min(86%, 300px);
    height: auto;
    max-height: none;
    box-shadow: var(--elev-raised-strong);
    transform: translateX(-102%);
    transition: transform var(--dur-move) var(--ease);
  }

  .shell[data-drawer="open"] .rail {
    transform: translateX(0);
  }

  .rail__scrim {
    position: fixed;
    inset: 0;
    z-index: 130;
    display: block;
    border: 0;
    background: rgba(20, 10, 12, 0.55);
    opacity: 0;
    /* visibility:hidden — not just opacity:0 — so the closed scrim leaves the
       accessibility tree and the tab order instead of lingering as an
       invisible control. */
    visibility: hidden;
    transition: opacity var(--dur-move) var(--ease), visibility 0s linear var(--dur-move);
  }

  .shell[data-drawer="open"] .rail__scrim {
    opacity: 1;
    visibility: visible;
    transition: opacity var(--dur-move) var(--ease), visibility 0s;
  }

  .facts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ---- 900px: attention band becomes 2x2 ---- */
@container app (max-width: 900px) {
  .attention {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .attention__item:nth-child(3),
  .attention__item:nth-child(4) {
    border-top: 1px solid var(--line);
  }

  .attention__item:nth-child(odd) {
    border-left: 0;
  }
}

/* ---- 767px: mobile ---- */
@container app (max-width: 767px) {
  .main {
    padding: var(--s-5) 16px calc(var(--s-10) + 76px);
  }

  .page-head {
    flex-direction: column;
    align-items: stretch;
    gap: var(--s-3);
  }

  .page-head__actions {
    justify-content: flex-start;
  }

  /* Lowest-priority columns leave first. Never status or quantity. */
  table.q .col-p3 {
    display: none;
  }

  .form-row {
    grid-template-columns: minmax(0, 1fr);
  }

  .facts {
    grid-template-columns: minmax(0, 1fr);
  }

  .drawer {
    width: 100%;
  }

  .detail__body {
    max-height: none;
  }

  /* Bottom tab bar */
  .tabbar {
    position: fixed;
    right: 10px;
    bottom: 10px;
    left: 10px;
    z-index: 120;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 3px;
    padding: 6px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-lg);
    background: var(--paper);
    box-shadow: var(--elev-3);
  }

  .tabbar button {
    position: relative;
    display: grid;
    place-items: center;
    gap: 4px;
    min-height: 52px;
    padding: 6px 3px;
    border-radius: var(--r-sm);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    transition:
      background-color var(--m-instant) var(--ease),
      color var(--m-instant) var(--ease);
  }

  .tabbar button .icon {
    color: var(--icon-ink-muted);
    transition: transform var(--m-small) var(--ease);
  }

  .tabbar button[aria-current="page"] {
    background: var(--anchor);
    color: var(--gold-200);
  }

  .tabbar button[aria-current="page"] .icon {
    color: var(--gold-300);
    transform: translateY(-1px) scale(1.06);
  }

  /* Sticky primary action */
  .action-bar {
    position: fixed;
    right: 0;
    bottom: 74px;
    left: 0;
    z-index: 118;
    display: flex;
    gap: var(--s-2);
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  .action-bar .btn {
    flex: 1;
  }

  .toast-region {
    right: 12px;
    bottom: 140px;
    left: 12px;
    max-width: none;
  }

  .menu {
    right: 12px;
    left: 12px;
    width: auto;
  }
}

/* ---- 560px: second-priority columns leave ---- */
@container app (max-width: 560px) {
  table.q .col-p2 {
    display: none;
  }

  .attention {
    grid-template-columns: minmax(0, 1fr);
  }

  .attention__item {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .attention__item:first-child {
    border-top: 0;
  }

  .receipt__ref {
    font-size: var(--t-lg);
  }
}

/* ---- 380px: last tightening; nothing operational is removed ---- */
@container app (max-width: 380px) {
  .main {
    padding-inline: 12px;
  }

  .topbar {
    padding-inline: 12px;
  }

  .account-button__text {
    display: none;
  }

  /* The shortcut hint is the first thing to go; the field itself stays usable. */
  .search kbd {
    display: none;
  }

  .stepper li span {
    display: none;
  }
}


/* ===== styles/v3.css ===== */
/* Hallmark · genre: modern-minimal · macrostructure: Workbench · design-system: DESIGN.md · designed-as-app · nav: N3/N9 · footer: Ft2 · contrast: pass (40–41) · slop: pass (42–45) · honest: pass (46) · chrome: pass (47) · tokens: pass (48) · responsive: pass (49) · icons: pass (30) · mobile: pass (34, 49, 50–57) */
/* DIRECTION CONTRACT
   THESIS: A calm institutional operations desk with decisive hierarchy.
   OWN-WORLD: HAU-USC Logistics, its public portals, and role-based workspaces.
   STORY: Choose the right portal, understand attention, then act with confidence.
   FIRST VIEWPORT: Brand, current place, primary work, and one clear next action.
   FORM: Bright paper and oxblood anchors; charcoal and warm oxblood after dark.
   FINISH: Restrained gold, crisp rules, purposeful motion, and no generic spinners.
   PRE-EMIT CRITIQUE: P5 H5 E4 S5 R5 V4 */

:root {
  --ox-900: #35070a;
  --ox-800: #5b0b10;
  --ox-700: #74141b;
  --ox-600: #8b222b;
  --ox-500: #a33642;
  --gold-700: #705015;
  --gold-600: #977025;
  --gold-500: #bd9138;
  --gold-400: #d4ad56;
  --gold-300: #e3c77d;
  --gold-200: #f1dfb4;
  --gold-100: #f8efd8;

  --canvas: #f2f0eb;
  --paper: #fffefa;
  --paper-2: #f7f4ee;
  --paper-3: #ffffff;
  --cream: #f3ecde;
  --ink: #211a1b;
  --ink-2: #4f4547;
  --muted: #6b6163;
  --line: #ded9d0;
  --line-strong: #bfb7aa;
  --line-hair: #ebe7df;
  --white: #ffffff;
  --anchor-ink: var(--white);
  --accent-ink: var(--ox-900);
  --anchor: var(--ox-800);
  --anchor-soft: color-mix(in srgb, var(--anchor) 7%, var(--paper));
  --anchor-line: color-mix(in srgb, var(--anchor) 24%, var(--line));
  --accent: var(--gold-500);
  --accent-wash: color-mix(in srgb, var(--gold-300) 24%, var(--paper));
  --accent-line: color-mix(in srgb, var(--gold-500) 48%, var(--line));

  --rail-from: #5c0b10;
  --rail-to: #310609;
  --rail-ink: #fff9ec;
  --rail-ink-dim: #ddc9c5;
  --rail-line: rgb(227 199 125 / 24%);

  --font-body: "Aptos", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-display: "Bahnschrift", "Aptos Display", "Segoe UI Variable", system-ui, sans-serif;
  --font-wordmark: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-mono: var(--font-body);

  --t-2xs: 10px;
  --t-xs: 12px;
  --t-sm: 14px;
  --t-md: 16px;
  --t-lg: 22px;
  --t-xl: 34px;
  --t-2xl: 50px;
  --t-display: clamp(38px, 4.3vw, 68px);
  --tracking-body: -0.012em;
  --tracking-tight: -0.035em;
  --tracking-label: 0.115em;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 44px;
  --s-12: 64px;
  --s-16: 84px;

  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-color: rgb(62 36 39 / 10%);
  --shadow-color-strong: rgb(62 36 39 / 18%);
  --elev-1: 0 1px 2px var(--shadow-color), 0 8px 24px var(--shadow-color);
  --elev-2: 0 2px 4px var(--shadow-color), 0 18px 44px var(--shadow-color-strong);
  --elev-3: 0 12px 28px var(--shadow-color-strong), 0 38px 80px var(--shadow-color-strong);
  --elev-inset: inset 0 1px 0 rgb(255 255 255 / 70%);

  --m-instant: 120ms;
  --m-small: 180ms;
  --m-surface: 260ms;
  --m-overlay: 320ms;
  --m-reveal: 440ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);

  --rail-w: 260px;
  --rail-w-collapsed: 76px;
  --content-max: 1540px;
  --focus-ring: 3px solid var(--gold-500);
  --control-h: 44px;
  --control-lg: 60px;
  --preview-load-delay: 85ms;
  --menu-line-w: 21px;
  --gold-rule: 2px;
}

[data-theme="dark"] {
  --ox-900: #35090d;
  --ox-800: #60171d;
  --ox-700: #7d272f;
  --ox-600: #9a3a44;
  --ox-500: #b8525c;
  --gold-700: #c19c54;
  --gold-600: #d0ad67;
  --gold-500: #dfbd78;
  --gold-400: #e8cc91;
  --gold-300: #efdbaa;
  --gold-200: #f5e8c9;
  --gold-100: #faf2df;
  --canvas: #120f10;
  --paper: #1c1819;
  --paper-2: #252021;
  --paper-3: #30292b;
  --cream: #eadfcd;
  --ink: #fbf7f0;
  --ink-2: #d7cccd;
  --muted: #aea3a5;
  --line: #3b3436;
  --line-strong: #5c5154;
  --line-hair: #2c2728;
  --anchor: var(--ox-600);
  --anchor-soft: color-mix(in srgb, var(--ox-600) 18%, var(--paper));
  --anchor-line: color-mix(in srgb, var(--ox-500) 38%, var(--line));
  --accent: var(--gold-500);
  --accent-wash: color-mix(in srgb, var(--gold-500) 12%, var(--paper));
  --accent-line: color-mix(in srgb, var(--gold-500) 36%, var(--line));
  --rail-from: #2c1014;
  --rail-to: #12090b;
  --rail-ink: #fff7e8;
  --rail-ink-dim: #cdb9b8;
  --rail-line: rgb(232 204 145 / 18%);
  --shadow-color: rgb(0 0 0 / 32%);
  --shadow-color-strong: rgb(0 0 0 / 54%);
  --elev-inset: inset 0 1px 0 rgb(255 255 255 / 5%);
}

html,
body {
  background: var(--canvas);
  overflow-x: clip;
}

body {
  font-size: var(--t-md);
}

body::before {
  background:
    radial-gradient(circle at 82% 4%, var(--accent-wash), transparent 28%),
    linear-gradient(var(--canvas), var(--canvas));
  content: "";
  inset: 0;
  pointer-events: none;
  position: fixed;
  z-index: -1;
}

h1,
h2,
h3,
.attention__value,
.public__head h1 {
  font-family: var(--font-display);
  min-width: 0;
  overflow-wrap: anywhere;
}

.frame {
  background: transparent;
}

.preview-bar {
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  border-bottom-color: var(--line);
  box-shadow: 0 1px 0 var(--line-hair);
  min-height: var(--control-h);
}

.preview-bar__brand {
  color: var(--ink);
  font-weight: 700;
}

.preview-bar__brand > .icon {
  color: var(--anchor);
}

.preview-bar__tag {
  background: var(--anchor-soft);
  border-color: var(--anchor-line);
  color: var(--anchor);
}

.preview-select,
.preview-bar button {
  min-height: var(--control-h);
}

.shell {
  background: transparent;
}

.rail {
  background:
    linear-gradient(155deg, color-mix(in srgb, var(--gold-500) 8%, transparent), transparent 28%),
    linear-gradient(180deg, var(--rail-from), var(--rail-to));
  border-right: 0;
  box-shadow: var(--elev-2);
}

.brand {
  border-bottom: var(--gold-rule) solid var(--rail-line);
  min-height: 98px;
  padding-block: var(--s-6);
}

.brand__seal {
  background: transparent;
  border: 1px solid var(--gold-400);
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--gold-400) 12%, transparent);
  color: var(--gold-300);
}

.brand__text b {
  color: var(--rail-ink);
  font-family: var(--font-wordmark);
  font-size: var(--t-md);
  letter-spacing: 0.015em;
}

.brand__text span {
  color: var(--rail-ink-dim);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.rail__nav {
  padding-block: var(--s-5);
}

.rail__nav a,
.rail__nav button {
  border-radius: var(--r-sm);
  min-height: var(--control-h);
  position: relative;
}

.rail__nav [aria-current="page"] {
  background: color-mix(in srgb, var(--white) 12%, transparent);
  box-shadow: inset var(--gold-rule) 0 0 var(--gold-400);
  color: var(--rail-ink);
}

.rail__nav [aria-current="page"] .icon {
  color: var(--gold-300);
}

.rail__foot {
  border-top-color: var(--rail-line);
  padding-block: var(--s-4);
}

.scope-button {
  min-height: var(--control-lg);
}

.workspace {
  background: transparent;
}

.topbar {
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  border-bottom: 0;
  box-shadow: 0 1px 0 var(--line-hair);
  gap: var(--s-4);
  min-height: 72px;
  padding-inline: clamp(var(--s-4), 3vw, var(--s-10));
}

.route-progress {
  background: var(--line-hair);
  height: var(--gold-rule);
  overflow: hidden;
}

.route-progress span {
  animation: route-arrive var(--m-reveal) var(--ease) both;
  background: linear-gradient(90deg, var(--anchor), var(--gold-500));
  display: block;
  height: 100%;
  transform-origin: left;
}

@keyframes route-arrive {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.menu-control {
  align-items: center;
  background: var(--anchor);
  border: 1px solid var(--anchor);
  border-radius: var(--r-sm);
  color: var(--anchor-ink);
  display: inline-flex;
  flex: 0 0 auto;
  gap: var(--s-3);
  min-height: var(--control-h);
  padding-inline: var(--s-4);
}

.menu-control:hover {
  background: var(--ox-700);
  border-color: var(--ox-700);
  transform: translateY(-1px);
}

.menu-control__glyph {
  display: grid;
  gap: var(--s-1);
  width: var(--menu-line-w);
}

.menu-control__glyph i {
  background: currentColor;
  display: block;
  height: var(--gold-rule);
  transform-origin: center;
  transition: transform var(--m-small) var(--ease), opacity var(--m-instant) ease;
}

.shell[data-drawer="open"] .menu-control__glyph i:first-child {
  transform: translateY(6px) rotate(45deg);
}

.shell[data-drawer="open"] .menu-control__glyph i:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}

.shell[data-drawer="open"] .menu-control__glyph i:last-child {
  transform: translateY(-6px) rotate(-45deg);
}

.menu-control__label {
  font-size: var(--t-sm);
  font-weight: 800;
  letter-spacing: 0.02em;
}

.search {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  min-height: var(--control-h);
}

.search:focus-within {
  background: var(--paper);
  border-color: var(--anchor);
  box-shadow: 0 0 0 3px var(--anchor-soft);
}

.topbar__actions {
  gap: var(--s-2);
}

.icon-button,
.account-button {
  min-height: var(--control-h);
  min-width: var(--control-h);
}

.theme-toggle {
  align-items: center;
  background: transparent;
  border: 0;
  display: inline-flex;
  justify-content: center;
  min-height: var(--control-h);
  min-width: 68px;
  padding: var(--s-1);
}

.theme-toggle__track {
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  box-shadow: var(--elev-inset);
  display: block;
  height: 34px;
  overflow: hidden;
  position: relative;
  transition: background var(--m-small) ease, border-color var(--m-small) ease;
  width: 62px;
}

.theme-toggle__sky {
  display: flex;
  gap: var(--s-1);
  inset: 0 var(--s-2) auto auto;
  position: absolute;
  top: 8px;
}

.theme-toggle__sky i {
  background: var(--gold-500);
  border-radius: 50%;
  height: 3px;
  opacity: 0.55;
  width: 3px;
}

.theme-toggle__thumb {
  align-items: center;
  background: var(--paper-3);
  border-radius: 50%;
  box-shadow: var(--elev-1);
  display: flex;
  height: 28px;
  justify-content: center;
  left: 2px;
  position: absolute;
  top: 2px;
  transform: translateX(0);
  transition: transform var(--m-surface) var(--ease), background var(--m-small) ease;
  width: 28px;
}

[data-theme="dark"] .theme-toggle__thumb {
  background: var(--anchor);
  transform: translateX(28px);
}

.theme-toggle__icons {
  display: grid;
  height: 18px;
  place-items: center;
  position: relative;
  width: 18px;
}

.theme-toggle__icons .icon {
  color: var(--gold-600);
  grid-area: 1 / 1;
  height: 18px;
  transition: opacity var(--m-small) ease, transform var(--m-surface) var(--ease);
  width: 18px;
}

.theme-toggle__moon {
  opacity: 0;
  transform: rotate(-80deg) scale(0.5);
