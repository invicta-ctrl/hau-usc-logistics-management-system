    <!-- The canonical theme loads FIRST so the local layers can alias it, and
         styles/theme-final.css loads LAST to do that aliasing. Everything
         between them is the accumulated v3/v4/v5 cascade, left intact because
         an accepted specification references those paths. -->
    <link rel="stylesheet" href="../shared/hau-theme.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/shell.css" />

    <link rel="stylesheet" href="./styles/v3.css" />
    <link rel="stylesheet" href="./styles/v4.css" />
    <link rel="stylesheet" href="./styles/v5.css" />
    <link rel="stylesheet" href="./styles/theme-final.css" />

    <!-- Theme is resolved BEFORE first paint. The body used to carry a hardcoded
         data-theme="light" and the app corrected it once the module had loaded,
         which meant a visitor whose system is dark got a full-viewport white
         flash on every load. Same precedence as the app: stored choice, then
         system preference. Kept inline and tiny because a separate request would
         reintroduce the flash it exists to remove. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('hau-usc-v4-theme');
        } catch (e) {
          /* opaque origin — fall through to the system preference */
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.addEventListener('DOMContentLoaded', function () {
          document.body.setAttribute('data-theme', theme);
        });
      })();
    </script>
  </head>
