<!doctype html>
<!-- data-theme is set by the pre-paint script below, not hardcoded here. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HAU-USC Logistics — Public Portals R3 prototype</title>
    <link rel="icon" href="data:," />

    <!-- Bundled .woff2, per DESIGN.md D09 and D30. This used to be a Google
         Fonts link with a note saying it was for design review only; it was
         replaced because the prototype should demonstrate the rule the product
         has to follow, and because every rendered audit inherited a network
         dependency it did not need. -->
    <link rel="stylesheet" href="../shared/fonts.css" />

    <!-- The canonical theme loads FIRST and is shared with the whole-site
         prototype. It is generated from scripts/design/theme-source.mjs; the
         two files below add only what is local to this prototype. -->
    <link rel="stylesheet" href="../shared/hau-theme.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./glass.css" />
    <link rel="stylesheet" href="./portal.css" />

    <!-- Theme resolved before first paint, same precedence as the app: an
         explicit ?theme= wins, otherwise the system preference. Without this the
         document renders light for one frame and the module corrects it, which a
         dark-preference visitor sees as a flash. -->
    <script>
      (function () {
        var explicit = new URLSearchParams(location.search).get('theme');
        var theme =
          explicit === 'light' || explicit === 'dark'
            ? explicit
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- G0 · the institutional ground. Fixed, non-interactive, aria-hidden:
         it carries no information, so it must never be announced. -->
    <div class="g0" data-module="lending" aria-hidden="true"></div>

    <!-- 2.4.1 Bypass Blocks. The prototype control bar and the portal masthead sit
         ahead of the catalog, so a keyboard user would otherwise tab the whole
         chrome on every route change. -->
    <a class="skip-link" href="#app">Skip to main content</a>

    <div class="proto-bar">
      <strong>R3 prototype</strong>
      <label>Route
        <select id="proto-route">
          <option value="lending">Public Lending</option>
          <option value="request">Public Request</option>
        </select>
      </label>
      <label>Theme
        <select id="proto-theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Catalog state
        <select id="proto-state">
          <option value="populated">Populated</option>
          <option value="loading">Loading</option>
          <option value="error">Service error</option>
          <option value="empty">Empty — nothing published</option>
        </select>
      </label>
      <span class="proto-note">design fixture · no backend · not production data</span>
    </div>

    <!-- Two persistent live regions, present at mount and empty, so injected text
         is actually announced. Polite carries result counts and confirmations;
         assertive carries blocked and failed actions. -->
    <div id="live-polite" class="sr-only" role="status" aria-live="polite"></div>
    <div id="live-assertive" class="sr-only" role="alert" aria-live="assertive"></div>

    <!-- ONE main landmark. The rendered views used to inject a second
         `<main class="shell">` inside this one, so a screen reader saw two main
         landmarks on every route. The inner element is now a div and this is the
         only landmark; it is also what the skip link targets. -->
    <main id="app" tabindex="-1"></main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
