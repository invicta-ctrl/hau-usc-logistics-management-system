name: Apps Script static check

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'scripts/check-apps-script.mjs'
      - 'appsscript.json'
      - '.clasp.json.example'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:apps-script
      - name: Verify example clasp configuration contains no deployed script ID
        run: grep -q 'REPLACE_WITH_STAGING_OR_PRODUCTION_SCRIPT_ID' .clasp.json.example
