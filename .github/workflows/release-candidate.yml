name: Candidate to Isolated Staging Playground

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to package and deploy to playground
        required: true
        type: string
      candidate_branch:
        description: Exact temporary release/fix/hotfix branch containing the candidate
        required: true
        type: string

concurrency:
  group: isolated-staging-playground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-release-candidate:
    runs-on: ubuntu-latest
    environment: release-candidate
    outputs:
      candidate_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be an exact lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_BRANCH" =~ ^(release|fix|hotfix)/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9][a-z0-9-]*$ ]]
          git fetch --no-tags --depth=1 origin "refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${EXPECTED_BRANCH}")" = "$EXPECTED_SHA"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact-head repository gates
        run: npm run check:release-candidate
      - name: Create bound release manifest
        run: node scripts/create-release-candidate-manifest.mjs .release/candidate.json
      - name: Upload immutable candidate package
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.identity.outputs.sha }}
          path: |
            .release/candidate.json
            dist/index.html
            HAU-USC_Logistics-Frontend-Shareable.html
          if-no-files-found: error
          retention-days: 14

  deploy-playground:
    needs: package-release-candidate
    runs-on: ubuntu-latest
    environment: isolated-staging-playground
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package-release-candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild exact staging artifact
        run: npm run build:cloudflare
      - name: Materialize fixed private playground manifest
        shell: bash
        env:
          PLAYGROUND_RESOURCE_MANIFEST_B64: ${{ secrets.PLAYGROUND_RESOURCE_MANIFEST_B64 }}
        run: |
          set -euo pipefail
          test -n "$PLAYGROUND_RESOURCE_MANIFEST_B64"
          printf '%s' "$PLAYGROUND_RESOURCE_MANIFEST_B64" | base64 --decode > "$RUNNER_TEMP/playground-resource-manifest.json"
          chmod 600 "$RUNNER_TEMP/playground-resource-manifest.json"
      - name: Build private candidate config
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: node scripts/playground/create-private-config.mjs "$RUNNER_TEMP/playground-resource-manifest.json" "$RUNNER_TEMP/wrangler.playground.private.jsonc"
      - name: Deploy exact candidate to isolated playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: node scripts/playground/deploy-playground.mjs "$RUNNER_TEMP/wrangler.playground.private.jsonc" "$RUNNER_TEMP/playground-resource-manifest.json"
      - name: Automated playground acceptance
        env:
          CONFIG_PATH: ${{ runner.temp }}/wrangler.playground.private.jsonc
          EXPECTED_SHA: ${{ needs.package-release-candidate.outputs.candidate_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile(process.env.CONFIG_PATH, 'utf8'));
          const origin = `https://${config.vars.RECOVERY_HOSTNAME}`;
          const expected = process.env.EXPECTED_SHA;
          for (let attempt = 1; attempt <= 15; attempt += 1) {
            const nonce = `${expected}-${attempt}-${Date.now()}`;
            const [readinessResponse, versionResponse] = await Promise.all([
              fetch(`${origin}/api/readiness?candidate=${nonce}`, {
                headers: { 'cache-control': 'no-cache' },
              }),
              fetch(`${origin}/api/version?candidate=${nonce}`, {
                headers: { 'cache-control': 'no-cache' },
              }),
            ]);
            const readiness = await readinessResponse.json().catch(() => null);
            const version = await versionResponse.json().catch(() => null);
            if (
              readinessResponse.ok &&
              readiness?.ready === true &&
              versionResponse.ok &&
              version?.environment === 'STAGING' &&
              version?.candidateSha === expected &&
              version?.database?.schemaVersion === '32'
            ) {
              process.exit(0);
            }
            if (attempt < 15) await new Promise((resolve) => setTimeout(resolve, 2_000));
          }
          throw new Error('Playground did not converge to the exact accepted candidate.');
          NODE
      - name: Stop for Earl manual testing
        run: |
          echo 'Playground acceptance is green.' >> "$GITHUB_STEP_SUMMARY"
          echo 'WAIT FOR EARL. No production job exists in this workflow.' >> "$GITHUB_STEP_SUMMARY"
