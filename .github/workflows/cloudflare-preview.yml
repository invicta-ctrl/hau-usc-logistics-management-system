name: Cloudflare static preview

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-static-preview
  cancel-in-progress: true

jobs:
  deploy-static-preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    env:
      PREVIEW_WORKER_NAME: hau-usc-logistics-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate and preview target
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be an exact lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "CLOUDFLARE_PREVIEW_ACCOUNT_ID must be a 32-character account ID" >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_PREVIEW_API_TOKEN is required" >&2
            exit 1
          fi
          subdomain_response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          export CLOUDFLARE_WORKERS_SUBDOMAIN_RESPONSE="$subdomain_response"
          preview_account_subdomain="$(
            node <<'NODE'
            let payload;
            try {
              payload = JSON.parse(process.env.CLOUDFLARE_WORKERS_SUBDOMAIN_RESPONSE ?? '');
            } catch {
              console.error('Cloudflare Workers subdomain response was not valid JSON.');
              process.exit(1);
            }
            const subdomain = payload?.success === true ? payload.result?.subdomain : null;
            const accountSubdomainPattern = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/u;
            if (
              process.env.PREVIEW_WORKER_NAME !== 'hau-usc-logistics-preview' ||
              typeof subdomain !== 'string' ||
              !accountSubdomainPattern.test(subdomain)
            ) {
              console.error('Cloudflare Workers subdomain response was missing a valid account subdomain for the fixed preview Worker.');
              process.exit(1);
            }
            process.stdout.write(subdomain);
            NODE
          )"
          unset CLOUDFLARE_WORKERS_SUBDOMAIN_RESPONSE
          preview_subdomain_file="$RUNNER_TEMP/cloudflare-preview-account-subdomain"
          printf '%s' "$preview_account_subdomain" > "$preview_subdomain_file"
          chmod 600 "$preview_subdomain_file"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build isolated mock preview
        run: npm run build
      - name: Prove preview configuration has no protected bindings
        run: npx wrangler deploy --dry-run --config cloudflare/wrangler.preview.jsonc --outdir .wrangler/preview-dry-run
      - name: Deploy isolated static preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/cloudflare-preview-deploy.log"
          trap 'rm -f -- "$deploy_log"' EXIT
          redact_preview_urls() {
            sed -E 's#https://[^[:space:]]+\.workers\.dev#https://<redacted>.workers.dev#g' "$deploy_log"
          }
          if ! npx wrangler deploy \
            --config cloudflare/wrangler.preview.jsonc \
            --strict \
            --tag "candidate-${CANDIDATE_SHA}" \
            --message "Static mock preview for ${CANDIDATE_SHA}" >"$deploy_log" 2>&1; then
            redact_preview_urls >&2
            exit 1
          fi
          redact_preview_urls
      - name: Smoke preview and record immutable evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          preview_root='preview-root.html'
          evidence='preview-evidence.txt'
          preview_subdomain_file="$RUNNER_TEMP/cloudflare-preview-account-subdomain"
          test -s "$preview_subdomain_file"
          trap 'rm -f -- "$preview_subdomain_file"' EXIT
          preview_account_subdomain="$(<"$preview_subdomain_file")"
          preview_url="https://${PREVIEW_WORKER_NAME}.${preview_account_subdomain}.workers.dev"
          preview_target_sha256="$(printf '%s' "$preview_url" | sha256sum | awk '{print $1}')"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            "${preview_url}?codex_candidate=${CANDIDATE_SHA}" \
            --output "$preview_root"
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          fetched_sha="$(sha256sum "$preview_root" | awk '{print $1}')"
          test "$local_sha" = "$fetched_sha"
          fetched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "preview_worker=$PREVIEW_WORKER_NAME"
            echo "preview_target_sha256=$preview_target_sha256"
            echo "local_dist_index_sha256=$local_sha"
            echo "fetched_root_html_sha256=$fetched_sha"
            echo "fetched_at=$fetched_at"
            echo 'result=PASS'
          } > "$evidence"
          {
            echo '### Cloudflare static preview smoke'
            echo
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Preview Worker: \`$PREVIEW_WORKER_NAME\`"
            echo "- Preview target SHA-256: \`$preview_target_sha256\` (complete URL withheld)"
            echo "- Local \`dist/index.html\` SHA-256: \`$local_sha\`"
            echo "- Fetched root HTML SHA-256: \`$fetched_sha\`"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0.7.1-preview-evidence-${{ inputs.candidate_sha }}
          path: preview-evidence.txt
          if-no-files-found: error
          retention-days: 14
